2 read registers \u2192 do maths \u2192 maybe touch memory \u2192 decide where to go next. Every instruction takes the same five-step shape; some just skip a step.</div>\n\n<h3>Why multiplexers exist</h3>\n<p>There are three places in the CPU where <strong>two different wires want to feed the same input</strong>:</p>\n<ol class=\"steps\">\n<li>PC+4 and the branch target both want to go into the PC.</li>\n<li>The ALU result and the memory read data both want to be written into a register.</li>\n<li>Read data 2 and the immediate both want to be the ALU's second operand.</li>\n</ol>\n<div class=\"note\"><b>The rule:</b> \"You can't just join wires together \u2014 use multiplexers.\" Every mux in the datapath exists because two sources compete for one input.</div>\n\n<h3>The two kinds of building block</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Type</th><th>What it does</th><th>Examples</th></tr>\n<tr><td><strong>Combinational</strong></td><td>Output is purely a function of the input. No memory.</td><td class=\"m\">AND gate (Y = A&amp;B), Mux (Y = S ? I1 : I0), Adder (Y = A+B), ALU (Y = F(A,B))</td></tr>\n<tr><td><strong>Sequential (state)</strong></td><td>Stores information. Needs a clock.</td><td class=\"m\">Registers, instruction memory, data memory, PC</td></tr>\n</table></div>\n\n<h3>Registers and clocking</h3>\n<ul>\n<li>A register is <strong>edge-triggered</strong>: it updates when the clock goes from <strong>0 to 1</strong>.</li>\n<li>A register <em>with write control</em> only updates on that edge <strong>if the write signal is 1</strong>. That is exactly what RegWrite does.</li>\n<li>Combinational logic does its work <strong>between</strong> clock edges: read from a state element, compute, write into a state element.</li>\n</ul>\n<div class=\"syntax\">The LONGEST delay through the combinational logic\nsets the clock period.</div>\n<div class=\"kid\"><b>Kid version:</b> the clock is a school bell. Everyone must finish their work before the bell rings, so the bell has to be slow enough for the slowest person.</div>"}, {"name": "Building the datapath", "mins": "25 / 40 min", "lesson": "\n<h2>Assembling the machine, one piece at a time</h2>\n<p><strong>Datapath</strong> = the elements that process data and addresses: registers, ALUs, muxes, memories.</p>\n\n<h3>Piece 1 \u2014 Instruction fetch</h3>\n<pre class=\"code\">PC \u2500\u2500\u252c\u2500\u2500\u2192 [Instruction memory] \u2500\u2500\u2192 Instruction\n     \u2502\n     \u2514\u2500\u2500\u2192 [Add] \u2190\u2500\u2500 4\n              \u2502\n              \u2514\u2500\u2500\u2192 back around to PC</pre>\n<ul>\n<li><strong>PC is a 64-bit register.</strong></li>\n<li>Its output splits: one branch feeds the instruction memory's read address, the other feeds an <strong>Add</strong> unit whose second input is the constant <strong>4</strong>.</li>\n<li>The Add output loops all the way back round into the PC. That is \"increment by 4 for the next instruction\".</li>\n</ul>\n\n<h3>Piece 2 \u2014 R-format instructions</h3>\n<p>Read two registers \u2192 do the operation \u2192 write the result back.</p>\n<ul>\n<li><strong>Register file</strong> has three 5-bit register-number inputs (<em>Read register 1</em>, <em>Read register 2</em>, <em>Write register</em>), one <em>Write data</em> input, and two outputs (<em>Read data 1</em>, <em>Read data 2</em>). Control input: <strong>RegWrite</strong>.</li>\n<li><strong>ALU</strong> takes two data inputs plus a <strong>4-bit ALU operation</strong> control input. It produces an <strong>ALU result</strong> and a <strong>Zero</strong> flag.</li>\n</ul>\n<div class=\"note\"><b>Zero is an OUTPUT of the ALU, not a control input.</b> It is high when the ALU result is zero \u2014 that is how <code>beq</code> knows the two registers were equal.</div>\n\n<h3>Piece 3 \u2014 Load and store</h3>\n<ul>\n<li>Address = register + a <strong>12-bit offset</strong>, so the offset must be <strong>sign-extended</strong> first. That is the <strong>Imm Gen</strong> unit: <strong>32 bits in, 64 bits out</strong>.</li>\n<li><strong>Data memory</strong> has an <em>Address</em> input, a <em>Write data</em> input and a <em>Read data</em> output, plus two controls: <strong>MemRead</strong> and <strong>MemWrite</strong>.</li>\n</ul>\n\n<h3>Piece 4 \u2014 Branches</h3>\n<ol class=\"steps\">\n<li>Read the two register operands.</li>\n<li>Compare them \u2014 the ALU <strong>subtracts</strong> and we look at the <strong>Zero</strong> output.</li>\n<li>Compute the target: sign-extend the displacement \u2192 <strong>shift left 1</strong> \u2192 <strong>add to the PC</strong>.</li>\n</ol>\n<div class=\"note\"><b>\"Shift left 1 just re-routes wires.\"</b> It is not a real functional unit and costs no time \u2014 you simply connect wire n to wire n+1. Free.</div>\n\n<h3>Three design rules that force the shape</h3>\n<ol class=\"steps\">\n<li>The first-cut datapath does <strong>one instruction in one clock cycle</strong>.</li>\n<li><strong>Each datapath element can only do one function at a time.</strong></li>\n<li>Therefore we need <strong>separate instruction and data memories</strong>, and multiplexers wherever different instructions need different sources.</li>\n</ol>\n<div class=\"kid\"><b>Kid version of rule 2:</b> one oven cannot bake two different cakes at the same moment. The instruction memory is busy fetching, so a load needs its own separate memory to read data from.</div>\n\n<h3>Mux polarities \u2014 memorise these</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Mux</th><th>Select = 0</th><th>Select = 1</th></tr>\n<tr><td class=\"m\">ALUSrc</td><td>Read data 2 (a register)</td><td>the sign-extended immediate</td></tr>\n<tr><td class=\"m\">MemtoReg</td><td>ALU result</td><td>Data memory Read data</td></tr>\n<tr><td class=\"m\">PCSrc</td><td>PC + 4</td><td>branch target</td></tr>\n</table></div>\n<div class=\"note\"><b>Classic drawing error:</b> getting the mux labels backwards. In the textbook figure the ALUSrc mux has 0 on top, but the MemtoReg mux has 1 on top. Label the inputs, not the positions.</div>"}, {"name": "Full datapath explorer", "mins": "25 / 40 min", "lesson": "\n<h2>The whole machine \u2014 and which parts each instruction lights up</h2>\n<p>Pick an instruction below. The parts it uses light up; the parts it ignores go faint. The control signals update underneath. <strong>This is the picture the exam asks you to draw.</strong></p>\n<div class=\"dpwrap\"><svg class=\"dp\" id=\"dpsvg\" viewBox=\"0 0 940 420\" role=\"img\" aria-label=\"RISC-V single cycle datapath\">\n<line class=\"stage\" x1=\"182\" y1=\"8\" x2=\"182\" y2=\"412\"/>\n<line class=\"stage\" x1=\"310\" y1=\"8\" x2=\"310\" y2=\"412\"/>\n<line class=\"stage\" x1=\"470\" y1=\"8\" x2=\"470\" y2=\"412\"/>\n<line class=\"stage\" x1=\"580\" y1=\"8\" x2=\"580\" y2=\"412\"/>\n<text class=\"stagelbl\" x=\"90\" y=\"406\" text-anchor=\"middle\">IF</text>\n<text class=\"stagelbl\" x=\"246\" y=\"406\" text-anchor=\"middle\">ID</text>\n<text class=\"stagelbl\" x=\"390\" y=\"406\" text-anchor=\"middle\">EX</text>\n<text class=\"stagelbl\" x=\"525\" y=\"406\" text-anchor=\"middle\">MEM</text>\n<text class=\"stagelbl\" x=\"700\" y=\"406\" text-anchor=\"middle\">WB</text>\n\n<path class=\"wire\" id=\"w-and-pcmux\" d=\"M556 78 L568 78 L568 18 L8 18 L8 196 L22 196\"/>\n<path class=\"wire\" id=\"w-addbr-pcmux\" d=\"M472 84 L482 84 L482 34 L14 34 L14 186 L22 186\"/>\n<path class=\"wire\" id=\"w-add4-pcmux\" d=\"M152 84 L170 84 L170 50 L20 50 L20 162 L22 162\"/>\n<path class=\"wire\" id=\"w-pcmux-pc\" d=\"M40 174 L48 174 L48 182 L58 182\"/>\n<path class=\"wire\" id=\"w-pc-im\" d=\"M84 182 L100 182\"/>\n<path class=\"wire\" id=\"w-pc-add4\" d=\"M92 182 L92 84 L104 84\"/>\n<path class=\"wire\" id=\"w-pc-addbr\" d=\"M92 128 L412 128 L412 72 L424 72\"/>\n<path class=\"wire\" id=\"w-im-bus\" d=\"M170 182 L192 182 L192 30 M192 182 L192 316\"/>\n<path class=\"wire\" id=\"w-bus-ctrl\" d=\"M192 30 L216 30\"/>\n<path class=\"wire\" id=\"w-bus-regs\" d=\"M192 150 L218 150 M192 172 L218 172 M192 194 L218 194\"/>\n<path class=\"wire\" id=\"w-bus-imm\" d=\"M192 316 L218 316\"/>\n<path class=\"wire\" id=\"w-bus-aluctl\" d=\"M192 340 L360 340\"/>\n<path class=\"wire\" id=\"w-regs-alu1\" d=\"M302 156 L352 156 L352 166 L360 166\"/>\n<path class=\"wire\" id=\"w-regs-alu2\" d=\"M302 190 L316 190 L316 176 L326 176\"/>\n<path class=\"wire\" id=\"w-regs-dm\" d=\"M316 190 L316 246 L478 246 L478 208 L492 208\"/>\n<path class=\"wire\" id=\"w-imm-alusrc\" d=\"M284 316 L302 316 L302 200 L326 200\"/>\n<path class=\"wire\" id=\"w-imm-sl1\" d=\"M302 272 L336 272\"/>\n<path class=\"wire\" id=\"w-sl1-addbr\" d=\"M398 272 L410 272 L410 92 L424 92\"/>\n<path class=\"wire\" id=\"w-alusrc-alu\" d=\"M342 188 L352 188 L352 194 L360 194\"/>\n<path class=\"wire\" id=\"w-alu-dm\" d=\"M418 178 L492 178\"/>\n<path class=\"wire\" id=\"w-alu-m2r\" d=\"M452 178 L452 300 L596 300 L596 206 L606 206\"/>\n<path class=\"wire\" id=\"w-alu-zero\" d=\"M388 152 L388 112 L520 112 L520 90 L528 90\"/>\n<path class=\"wire\" id=\"w-ctrl-and\" d=\"M290 30 L512 30 L512 66 L528 66\"/>\n<path class=\"wire\" id=\"w-dm-m2r\" d=\"M564 172 L606 172\"/>\n<path class=\"wire\" id=\"w-m2r-regs\" d=\"M622 190 L636 190 L636 372 L204 372 L204 212 L218 212\"/>\n\n<g class=\"cmp\" id=\"c-pcmux\"><rect class=\"box\" x=\"22\" y=\"152\" width=\"18\" height=\"52\" rx=\"8\"/><text class=\"lbl sm\" x=\"31\" y=\"182\" text-anchor=\"middle\">M</text></g>\n<g class=\"cmp\" id=\"c-pc\"><rect class=\"box\" x=\"58\" y=\"162\" width=\"26\" height=\"40\" rx=\"3\"/><text class=\"lbl\" x=\"71\" y=\"186\" text-anchor=\"middle\">PC</text></g>\n<g class=\"cmp\" id=\"c-im\"><rect class=\"box\" x=\"100\" y=\"150\" width=\"70\" height=\"64\" rx=\"3\"/><text class=\"lbl\" x=\"135\" y=\"176\" text-anchor=\"middle\">Instr</text><text class=\"lbl\" x=\"135\" y=\"190\" text-anchor=\"middle\">memory</text></g>\n<g class=\"cmp\" id=\"c-add4\"><rect class=\"box\" x=\"104\" y=\"64\" width=\"48\" height=\"40\" rx=\"3\"/><text class=\"lbl\" x=\"128\" y=\"80\" text-anchor=\"middle\">Add</text><text class=\"lbl sm\" x=\"128\" y=\"94\" text-anchor=\"middle\">PC+4</text></g>\n<g class=\"cmp\" id=\"c-ctrl\"><rect class=\"box\" x=\"216\" y=\"16\" width=\"74\" height=\"28\" rx=\"14\"/><text class=\"lbl\" x=\"253\" y=\"34\" text-anchor=\"middle\">Control</text></g>\n<g class=\"cmp\" id=\"c-regs\"><rect class=\"box\" x=\"218\" y=\"132\" width=\"84\" height=\"92\" rx=\"3\"/><text class=\"lbl\" x=\"260\" y=\"166\" text-anchor=\"middle\">Registers</text><text class=\"lbl sm\" x=\"260\" y=\"180\" text-anchor=\"middle\">rs1 rs2 rd</text><text class=\"lbl sm\" x=\"260\" y=\"206\" text-anchor=\"middle\">read 1 / 2</text></g>\n<g class=\"cmp\" id=\"c-imm\"><rect class=\"box\" x=\"218\" y=\"302\" width=\"66\" height=\"28\" rx=\"3\"/><text class=\"lbl\" x=\"251\" y=\"320\" text-anchor=\"middle\">Imm Gen</text></g>\n<g class=\"cmp\" id=\"c-sl1\"><rect class=\"box\" x=\"336\" y=\"258\" width=\"62\" height=\"28\" rx=\"3\"/><text class=\"lbl sm\" x=\"367\" y=\"276\" text-anchor=\"middle\">Shift left 1</text></g>\n<g class=\"cmp\" id=\"c-addbr\"><rect class=\"box\" x=\"424\" y=\"62\" width=\"48\" height=\"42\" rx=\"3\"/><text class=\"lbl\" x=\"448\" y=\"80\" text-anchor=\"middle\">Add</text><text class=\"lbl sm\" x=\"448\" y=\"94\" text-anchor=\"middle\">branch</text></g>\n<g class=\"cmp\" id=\"c-and\"><rect class=\"box\" x=\"528\" y=\"60\" width=\"28\" height=\"36\" rx=\"3\"/><text class=\"lbl sm\" x=\"542\" y=\"82\" text-anchor=\"middle\">AND</text></g>\n<g class=\"cmp\" id=\"c-alusrc\"><rect class=\"box\" x=\"326\" y=\"166\" width=\"16\" height=\"44\" rx=\"7\"/><text class=\"lbl sm\" x=\"334\" y=\"192\" text-anchor=\"middle\">M</text></g>\n<g class=\"cmp\" id=\"c-alu\"><rect class=\"box\" x=\"360\" y=\"146\" width=\"58\" height=\"64\" rx=\"3\"/><text class=\"lbl\" x=\"389\" y=\"176\" text-anchor=\"middle\">ALU</text><text class=\"lbl sm\" x=\"389\" y=\"192\" text-anchor=\"middle\">Zero</text></g>\n<g class=\"cmp\" id=\"c-aluctl\"><rect class=\"box\" x=\"360\" y=\"326\" width=\"76\" height=\"28\" rx=\"14\"/><text class=\"lbl sm\" x=\"398\" y=\"344\" text-anchor=\"middle\">ALU control</text></g>\n<g class=\"cmp\" id=\"c-dm\"><rect class=\"box\" x=\"492\" y=\"150\" width=\"72\" height=\"66\" rx=\"3\"/><text class=\"lbl\" x=\"528\" y=\"176\" text-anchor=\"middle\">Data</text><text class=\"lbl\" x=\"528\" y=\"190\" text-anchor=\"middle\">memory</text></g>\n<g class=\"cmp\" id=\"c-m2r\"><rect class=\"box\" x=\"606\" y=\"162\" width=\"16\" height=\"48\" rx=\"7\"/><text class=\"lbl sm\" x=\"614\" y=\"190\" text-anchor=\"middle\">M</text></g>\n\n<text class=\"lbl sm\" x=\"46\" y=\"148\">PCSrc</text>\n<text class=\"lbl sm\" x=\"330\" y=\"162\">ALUSrc</text>\n<text class=\"lbl sm\" x=\"596\" y=\"158\">MemtoReg</text>\n<text class=\"lbl sm\" x=\"492\" y=\"145\">MemWrite/Read</text>\n<text class=\"lbl sm\" x=\"218\" y=\"128\">RegWrite</text>\n</svg></div>\n<div class=\"simbtns\" id=\"dpbtns\"></div>\n<div class=\"ctrltbl\" id=\"dpsig\"></div>\n<div class=\"simmsg\" id=\"dpmsg\" style=\"margin-top:12px\"></div>\n\n<h3>How the instruction bits are routed</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Bits</th><th>Go to</th></tr>\n<tr><td class=\"m\">Instruction [6-0]</td><td>Control unit (the opcode)</td></tr>\n<tr><td class=\"m\">Instruction [19-15]</td><td>Read register 1 (rs1)</td></tr>\n<tr><td class=\"m\">Instruction [24-20]</td><td>Read register 2 (rs2)</td></tr>\n<tr><td class=\"m\">Instruction [11-7]</td><td>Write register (rd)</td></tr>\n<tr><td class=\"m\">Instruction [31-0]</td><td>Imm Gen (the whole word)</td></tr>\n<tr><td class=\"m\">Instruction [30, 14-12]</td><td>ALU control (funct7 bit 30 + funct3)</td></tr>\n</table></div>\n\n<h3>The one Boolean equation you must know</h3>\n<div class=\"syntax\">PCSrc = Branch AND Zero</div>\n<p>PCSrc is <strong>not</strong> a direct output of the Control unit. The Control unit produces <strong>Branch</strong>; the ALU produces <strong>Zero</strong>; an <strong>AND gate</strong> combines them. So a <code>beq</code> only takes the branch when both are 1.</p>\n<div class=\"kid\"><b>Kid version:</b> \"Am I a branch instruction?\" AND \"were the two numbers equal?\" Both yes \u2192 jump. Otherwise carry on to PC+4.</div>\n\n<h3>Path walk-through: R-type (e.g. add x1, x2, x3)</h3>\n<ol class=\"steps\">\n<li>PC \u2192 instruction memory, fetch. PC+4 computed and selected (PCSrc = 0).</li>\n<li>Bits [19-15] and [24-20] read two registers.</li>\n<li>Read data 1 \u2192 ALU input A. Read data 2 \u2192 ALUSrc mux input 0 \u2192 ALU input B (<strong>ALUSrc = 0</strong>).</li>\n<li>ALU does what ALU control says (ALUOp = 10 \u2192 funct decides).</li>\n<li>ALU result \u2192 MemtoReg mux input 0 (<strong>MemtoReg = 0</strong>) \u2192 back along the bottom to Write data.</li>\n<li>Bits [11-7] pick the write register; <strong>RegWrite = 1</strong> commits it.</li>\n</ol>\n<p>Data memory is bypassed entirely, and Branch = 0.</p>\n\n<h3>Path walk-through: load (ld x1, offset(x2))</h3>\n<ol class=\"steps\">\n<li>Fetch, PC+4 as usual.</li>\n<li>Bits [19-15] read the base register \u2192 ALU input A.</li>\n<li>Imm Gen sign-extends the offset \u2192 ALUSrc mux input 1 \u2192 ALU input B (<strong>ALUSrc = 1</strong>).</li>\n<li>ALU <strong>adds</strong> (ALUOp = 00) \u2192 the memory address \u2192 Data memory Address.</li>\n<li><strong>MemRead = 1</strong> \u2192 Read data comes out.</li>\n<li>Read data \u2192 MemtoReg mux input 1 (<strong>MemtoReg = 1</strong>) \u2192 Write data. <strong>RegWrite = 1</strong>.</li>\n</ol>\n<p>Read register 2 and the Data memory Write data input are unused.</p>\n\n<h3>Path walk-through: store (sd x1, offset(x2))</h3>\n<p>Same address calculation as a load (ALUSrc = 1, ALU adds). But now <strong>Read data 2 goes to Data memory Write data</strong>, <strong>MemWrite = 1</strong>, and <strong>RegWrite = 0</strong> \u2014 nothing is written back to the register file, so MemtoReg is a don't-care.</p>\n\n<h3>Path walk-through: beq x1, x2, offset</h3>\n<ol class=\"steps\">\n<li>Fetch. PC+4 goes to PCSrc mux input 0.</li>\n<li>PC also goes to the <strong>branch adder</strong>.</li>\n<li>Imm Gen \u2192 <strong>Shift left 1</strong> \u2192 branch adder's other input.</li>\n<li>Branch adder \u2192 <strong>Sum</strong> = branch target \u2192 PCSrc mux input 1.</li>\n<li>Both registers read \u2192 ALU with <strong>ALUSrc = 0</strong>; ALUOp = 01 \u2192 ALU control 0110 \u2192 <strong>subtract</strong>.</li>\n<li><strong>Zero</strong> AND <strong>Branch</strong> \u2192 PCSrc. Equal \u2192 take the branch; not equal \u2192 PC+4.</li>\n</ol>\n<p>No register write, no memory access.</p>\n\n<h3>The critical path</h3>\n<div class=\"note\"><b>The load instruction is the critical path:</b> Instruction memory \u2192 register file \u2192 ALU \u2192 data memory \u2192 register file. It is the longest route, so it sets the clock period for the whole single-cycle machine. Every other instruction finishes early and then waits \u2014 which is why single-cycle \"violates the design principle of making the common case fast\".</div>"}, {"name": "Control signals", "mins": "25 / 35 min", "lesson": "\n<h2>Telling the datapath what to do</h2>\n\n<h3>The ALU's four jobs</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>ALU control</th><th>Function</th></tr>\n<tr><td class=\"m\">0000</td><td>AND</td></tr>\n<tr><td class=\"m\">0001</td><td>OR</td></tr>\n<tr><td class=\"m\">0010</td><td>add</td></tr>\n<tr><td class=\"m\">0110</td><td>subtract</td></tr>\n</table></div>\n<p>The ALU is used for three different purposes:</p>\n<ul>\n<li><strong>Load / store</strong> \u2192 the function must be <strong>add</strong> (compute the address).</li>\n<li><strong>Branch</strong> \u2192 the function must be <strong>subtract</strong> (compare).</li>\n<li><strong>R-type</strong> \u2192 the function depends on the instruction's funct bits.</li>\n</ul>\n\n<h3>ALUOp \u2014 the 2-bit shortcut</h3>\n<p>The Control unit does not produce the 4-bit ALU control directly. It produces a <strong>2-bit ALUOp</strong>, and a small block of combinational logic turns ALUOp + funct bits into the 4-bit code.</p>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>opcode</th><th>ALUOp</th><th>Operation</th><th>ALU function</th><th>ALU control</th></tr>\n<tr><td class=\"m\">ld</td><td class=\"m\">00</td><td>load</td><td>add</td><td class=\"m\">0010</td></tr>\n<tr><td class=\"m\">sd</td><td class=\"m\">00</td><td>store</td><td>add</td><td class=\"m\">0010</td></tr>\n<tr><td class=\"m\">beq</td><td class=\"m\">01</td><td>branch on equal</td><td>subtract</td><td class=\"m\">0110</td></tr>\n<tr><td class=\"m\">R-type</td><td class=\"m\">10</td><td>add</td><td>add</td><td class=\"m\">0010</td></tr>\n<tr><td class=\"m\">R-type</td><td class=\"m\">10</td><td>subtract</td><td>subtract</td><td class=\"m\">0110</td></tr>\n<tr><td class=\"m\">R-type</td><td class=\"m\">10</td><td>AND</td><td>AND</td><td class=\"m\">0000</td></tr>\n<tr><td class=\"m\">R-type</td><td class=\"m\">10</td><td>OR</td><td>OR</td><td class=\"m\">0001</td></tr>\n</table></div>\n<div class=\"kid\"><b>Kid version:</b> ALUOp says \"which family am I?\" \u2014 00 means \"just add\", 01 means \"just subtract\", 10 means \"look at the funct bits and decide\".</div>\n\n<h3>The control signal table \u2014 the exam's favourite</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Instruction</th><th>ALUSrc</th><th>MemtoReg</th><th>RegWrite</th><th>MemRead</th><th>MemWrite</th><th>Branch</th><th>ALUOp</th></tr>\n<tr><td><strong>R-type</strong></td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">1</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">10</td></tr>\n<tr><td><strong>ld</strong></td><td class=\"m\">1</td><td class=\"m\">1</td><td class=\"m\">1</td><td class=\"m\">1</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">00</td></tr>\n<tr><td><strong>sd</strong></td><td class=\"m\">1</td><td class=\"m\">X</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">1</td><td class=\"m\">0</td><td class=\"m\">00</td></tr>\n<tr><td><strong>beq</strong></td><td class=\"m\">0</td><td class=\"m\">X</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">0</td><td class=\"m\">1</td><td class=\"m\">01</td></tr>\n</table></div>\n\n<h3>How to rebuild that table from scratch in the exam</h3>\n<ol class=\"steps\">\n<li><strong>RegWrite</strong> \u2014 \"does this instruction change a register?\" R-type and ld yes; sd and beq no.</li>\n<li><strong>ALUSrc</strong> \u2014 \"is the ALU's second operand an immediate?\" ld and sd yes; R-type and beq use a register.</li>\n<li><strong>MemRead / MemWrite</strong> \u2014 only ld reads, only sd writes. Never both.</li>\n<li><strong>MemtoReg</strong> \u2014 \"does the written value come from memory?\" Only ld. It is a <strong>don't-care (X)</strong> whenever RegWrite = 0, because nothing is being written.</li>\n<li><strong>Branch</strong> \u2014 only beq.</li>\n<li><strong>ALUOp</strong> \u2014 00 = add for ld/sd, 01 = subtract for beq, 10 = R-type looks at funct.</li>\n</ol>\n<div class=\"note\"><b>Why X and not 0?</b> MemtoReg only chooses which value reaches the register file. If RegWrite = 0, no value is written at all, so the mux setting cannot matter. Writing X shows you understand that \u2014 writing 0 is not wrong but shows less.</div>\n\n<h3>The three signals people mix up</h3>\n<ul>\n<li><strong>Zero</strong> is an ALU <em>output</em>, not a control input.</li>\n<li><strong>PCSrc</strong> comes from an <em>AND gate</em>, not from the Control unit.</li>\n<li><strong>MemtoReg = 1 means memory</strong> in this book's figures, while <strong>ALUSrc = 1 means immediate</strong>. The two muxes are drawn with opposite polarities on the page, so read the labels every time.</li>\n</ul>"}, {"name": "Pipelining", "mins": "25 / 35 min", "lesson": "\n<h2>Doing five things at once</h2>\n\n<h3>The laundry analogy</h3>\n<p>Four loads of washing, each needing wash \u2192 dry \u2192 fold \u2192 put away.</p>\n<ul>\n<li><strong>Sequential:</strong> finish load A completely before starting B. Four loads take from 6 pm to <strong>2 am</strong>.</li>\n<li><strong>Pipelined:</strong> the moment A moves to the dryer, B starts washing. Everything finishes by about <strong>9:30 pm</strong>.</li>\n</ul>\n<div class=\"kid\"><b>Kid version:</b> pipelining does not make one load of washing faster. It just stops the machines standing idle.</div>\n\n<h3>The five RISC-V stages</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Stage</th><th>Name</th><th>What happens</th></tr>\n<tr><td class=\"m\">1</td><td><strong>IF</strong></td><td>Instruction Fetch from memory</td></tr>\n<tr><td class=\"m\">2</td><td><strong>ID</strong></td><td>Instruction Decode &amp; register read</td></tr>\n<tr><td class=\"m\">3</td><td><strong>EX</strong></td><td>Execute operation or calculate address</td></tr>\n<tr><td class=\"m\">4</td><td><strong>MEM</strong></td><td>Access memory operand</td></tr>\n<tr><td class=\"m\">5</td><td><strong>WB</strong></td><td>Write result Back to register</td></tr>\n</table></div>\n\n<h3>The timing numbers \u2014 memorise this table</h3>\n<p>Assume <strong>100 ps</strong> for a register read or write, <strong>200 ps</strong> for every other stage.</p>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Instr</th><th>IF</th><th>Reg read</th><th>ALU</th><th>Memory</th><th>Reg write</th><th>Total</th></tr>\n<tr class=\"on\"><td class=\"m\">ld</td><td class=\"m\">200</td><td class=\"m\">100</td><td class=\"m\">200</td><td class=\"m\">200</td><td class=\"m\">100</td><td class=\"m\"><strong>800 ps</strong></td></tr>\n<tr><td class=\"m\">sd</td><td class=\"m\">200</td><td class=\"m\">100</td><td class=\"m\">200</td><td class=\"m\">200</td><td class=\"m\">\u2014</td><td class=\"m\">700 ps</td></tr>\n<tr><td class=\"m\">R-format</td><td class=\"m\">200</td><td class=\"m\">100</td><td class=\"m\">200</td><td class=\"m\">\u2014</td><td class=\"m\">100</td><td class=\"m\">600 ps</td></tr>\n<tr><td class=\"m\">beq</td><td class=\"m\">200</td><td class=\"m\">100</td><td class=\"m\">200</td><td class=\"m\">\u2014</td><td class=\"m\">\u2014</td><td class=\"m\">500 ps</td></tr>\n</table></div>\n<p><strong>ld is the longest at 800 ps</strong>, so a single-cycle machine must use a clock period of 800 ps for everything.</p>\n\n<h3>Single-cycle vs pipelined</h3>\n<div class=\"pipe\" id=\"pipedemo\"></div>\n<pre class=\"code\">Single-cycle:  T_c = <b>800 ps</b>   (set by the slowest INSTRUCTION)\nPipelined:     T_c = <b>200 ps</b>   (set by the slowest STAGE)\n\nThree loads:\n  single-cycle finishes at 3 \u00d7 800 = <b>2400 ps</b>\n  pipelined  finishes at (5 \u00d7 200) + (2 \u00d7 200) = <b>1400 ps</b>\n  actual speedup = 2400 / 1400 \u2248 <b>1.7\u00d7</b>\n\nIdeal speedup (huge instruction count) = 800 / 200 = <b>4\u00d7</b></pre>\n<div class=\"syntax\">Time between instructions (pipelined)\n   = Time between instructions (non-pipelined) \u00f7 number of stages</div>\n<div class=\"note\"><b>Why only 1.7\u00d7 and not 4\u00d7?</b> The first instruction still has to walk through all five stages before anything finishes \u2014 that is the \"fill\" cost. With three instructions the fill dominates. With thousands of instructions it disappears and you approach the ideal 4\u00d7. The formula only holds for balanced stages and a large instruction count.</div>\n\n<h3>The trap in \"does pipelining make instructions faster?\"</h3>\n<div class=\"note\"><b>No.</b> Pipelining improves <strong>throughput</strong> (instructions finished per second). The <strong>latency of one instruction is unchanged</strong> \u2014 arguably slightly worse, since every stage now takes the full 200 ps even if it only needed 100. This is the classic exam trap.</div>\n\n<h3>Why RISC-V pipelines so well</h3>\n<ol class=\"steps\">\n<li><strong>All instructions are 32 bits</strong> \u2014 easy to fetch and decode in one cycle. Compare x86, where instructions are 1 to 17 bytes.</li>\n<li><strong>Few and regular formats</strong> \u2014 registers sit in the same place every time, so you can decode and read registers in one step.</li>\n<li><strong>Load/store addressing</strong> \u2014 the address can be computed in stage 3 (EX) and memory accessed in stage 4 (MEM), which fits the five-stage shape perfectly.</li>\n</ol>"}, {"name": "Hazards", "mins": "25 / 40 min", "lesson": "\n<h2>The three things that break a pipeline</h2>\n<p><strong>Hazard</strong> = a situation that stops the next instruction starting in the next cycle.</p>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Hazard</th><th>Cause</th></tr>\n<tr><td><strong>Structural</strong></td><td>A required <strong>resource is busy</strong></td></tr>\n<tr><td><strong>Data</strong></td><td>Must <strong>wait for a previous instruction</strong> to produce its data</td></tr>\n<tr><td><strong>Control</strong></td><td>The next action <strong>depends on a branch</strong> that has not resolved</td></tr>\n</table></div>\n\n<h3>1. Structural hazard</h3>\n<p>With a <strong>single memory</strong>, a load or store needs a data access in the MEM stage at the same moment another instruction wants an instruction fetch in IF. They collide, one must <strong>stall</strong>, and a <strong>bubble</strong> appears in the pipeline.</p>\n<div class=\"note\"><b>The fix:</b> separate instruction and data memories \u2014 or separate instruction and data caches. This is exactly the same rule as in the single-cycle datapath, appearing again.</div>\n\n<h3>2. Data hazard</h3>\n<pre class=\"code\"><b>add x19, x0, x1</b>\n<b>sub x2, <u>x19</u>, x3</b>     <i>// needs x19 before add has written it</i></pre>\n<p>Without any fix, <code>sub</code> must wait until <code>add</code> reaches WB. That is a stall of two cycles.</p>\n\n<h3>Forwarding (bypassing) \u2014 the fix</h3>\n<p><strong>Use the result the moment it is computed. Don't wait for it to be stored in a register.</strong> It needs extra wires in the datapath.</p>\n<pre class=\"code\"><b>add x1, x2, x3</b>\n<b>sub x4, <u>x1</u>, x5</b></pre>\n<div class=\"pipe\" id=\"fwdemo\"></div>\n<p>The value of x1 exists at the <strong>end of add's EX stage</strong>. sub needs it at the <strong>start of its own EX stage</strong> \u2014 which is the very next cycle. A wire from EX output to EX input delivers it just in time. <strong>Result: zero stalls.</strong></p>\n\n<h3>3. Load-use hazard \u2014 when forwarding is not enough</h3>\n<pre class=\"code\"><b>ld  x1, 0(x2)</b>\n<b>sub x4, <u>x1</u>, x5</b></pre>\n<div class=\"pipe\" id=\"ludemo\"></div>\n<p>A load's value only exists at the <strong>end of MEM</strong>, but sub wants it at the start of its EX \u2014 which happens <em>earlier in time</em>.</p>\n<div class=\"note\"><b>\"Can't forward backward in time!\"</b> So we stall one cycle, and then forward from MEM to EX. The load-use penalty is <strong>exactly one bubble</strong>, and it is unavoidable by forwarding alone.</div>\n\n<h3>Code scheduling \u2014 avoiding the stall in software</h3>\n<p>C code: <code>a = b + e; c = b + f;</code></p>\n<div class=\"simgrid\">\n<div><strong>Original \u2014 13 cycles</strong>\n<pre class=\"code\">ld   x1, 0(x0)\nld   x2, 8(x0)\n<u>stall</u>\nadd  x3, x1, x2\nsd   x3, 24(x0)\nld   x4, 16(x0)\n<u>stall</u>\nadd  x5, x1, x4\nsd   x5, 32(x0)</pre></div>\n<div><strong>Rescheduled \u2014 11 cycles</strong>\n<pre class=\"code\">ld   x1, 0(x0)\nld   x2, 8(x0)\n<b>ld   x4, 16(x0)</b>   <i>// moved up</i>\nadd  x3, x1, x2\nsd   x3, 24(x0)\nadd  x5, x1, x4\nsd   x5, 32(x0)</pre></div>\n</div>\n<p>Moving the third load earlier puts distance between each load and its use, so neither <code>add</code> stalls. <strong>13 \u2192 11 cycles, saving 2.</strong> Check it: 7 instructions with no stalls = 7 + 4 = 11 cycles. Exactly right.</p>\n<div class=\"kid\"><b>Kid version:</b> don't ask for the pizza the second you order it. Do something else for one minute and it arrives without you waiting.</div>\n\n<h3>4. Control hazard \u2014 stall on branch</h3>\n<pre class=\"code\"><b>add x4, x5, x6</b>\n<b>beq x1, x0, 40</b>\n<b>or  x7, x8, x9</b>     <i>// which instruction comes next? unknown yet</i></pre>\n<p>We must wait until the branch outcome is known before fetching the next instruction. Instead of <code>or</code> being fetched 200 ps after <code>beq</code>, it is fetched <strong>400 ps</strong> after \u2014 one extra cycle, one bubble.</p>\n\n<h3>Pipeline registers</h3>\n<p>Each stage needs somewhere to park the information it produced, so the next stage can pick it up next cycle. That is what the <strong>four pipeline registers</strong> are for:</p>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Register</th><th>Between</th><th>Carries</th></tr>\n<tr><td class=\"m\">IF/ID</td><td>IF \u2192 ID</td><td>the fetched instruction, and the PC</td></tr>\n<tr><td class=\"m\">ID/EX</td><td>ID \u2192 EX</td><td>Read data 1, Read data 2, the immediate, the PC</td></tr>\n<tr><td class=\"m\">EX/MEM</td><td>EX \u2192 MEM</td><td>branch target Sum, Zero, ALU result, store data</td></tr>\n<tr><td class=\"m\">MEM/WB</td><td>MEM \u2192 WB</td><td>memory Read data and the ALU result</td></tr>\n</table></div>\n<div class=\"note\"><b>\"Right-to-left flow leads to hazards.\"</b> Look at the datapath: two wires run backwards \u2014 WB back to the register file (that is the <strong>data</strong> hazard) and the branch result back to the PC (that is the <strong>control</strong> hazard). The backwards arrows are literally where the trouble comes from.</div>\n\n<h3>The big picture</h3>\n<ul>\n<li>Pipelining improves performance by increasing <strong>instruction throughput</strong>, executing multiple instructions in parallel.</li>\n<li><strong>Each instruction has the same latency</strong> as before.</li>\n<li>It is subject to hazards: structural, data, control.</li>\n<li>Instruction set design affects how hard the pipeline is to build.</li>\n</ul>"}]}, {"name": "Ch 5", "tag": "Large and Fast: Exploiting Memory Hierarchy", "blurb": "Why cache exists, how to split an address, and AMAT. Slides 1\u201325 plus the handout.", "units": [{"name": "Locality \u00b7 Hierarchy", "mins": "15 / 25 min", "lesson": "\n<h2>Why cache exists</h2>\n<p>The CPU is fast. Main memory is slow. If the CPU waited for memory on every instruction, all that speed would be wasted.</p>\n\n<h3>The observation everything is built on</h3>\n<p>A program may be 10,000 instructions long, but <strong>at any moment only a small part of it is actually in use</strong>.</p>\n<pre class=\"code\">for (i = 0; i &lt; 100; i++) {\n    array[i] = array[i] + 1;\n}</pre>\n<p>The program is huge, but for a long stretch the CPU runs these <strong>three lines</strong> over and over, touching one small piece of memory.</p>\n\n<h3>The two localities</h3>\n<ul>\n<li><strong>Temporal locality</strong> \u2014 something used recently will be used again soon. Example: instructions in a loop, or a counter variable.</li>\n<li><strong>Spatial locality</strong> \u2014 something <em>near</em> what you just used will be used soon. Example: array elements, and instructions that run one after another.</li>\n</ul>\n<div class=\"kid\"><b>How to tell them apart:</b> same address again \u2192 temporal. Neighbouring address \u2192 spatial.</div>\n\n<h3>The memory hierarchy</h3>\n<div class=\"pyr\">\n<div style=\"width:44%\"><span>Registers</span><span>SRAM</span></div>\n<div style=\"width:54%\"><span>L1 Cache</span><span>SRAM</span></div>\n<div style=\"width:64%\"><span>L2 Cache</span><span>SRAM</span></div>\n<div style=\"width:74%\"><span>L3 Cache</span><span>SRAM</span></div>\n<div style=\"width:86%\"><span>RAM</span><span>DRAM</span></div>\n<div style=\"width:100%\"><span>Disk</span><span>Magnetic / SSD / Flash</span></div>\n</div>\n<ul>\n<li><strong>Closer to the CPU</strong> \u2192 faster, smaller, dearer per bit.</li>\n<li><strong>Further away</strong> \u2192 slower, bigger, cheaper per bit.</li>\n</ul>\n<p>The idea: keep everything on disk, copy recently-used (and nearby) items up into DRAM, then copy the most recently used of those up into SRAM cache.</p>\n\n<h3>Memory technology \u2014 the numbers from the slides</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Technology</th><th>Access time</th><th>Cost per GB</th></tr>\n<tr><td>SRAM</td><td class=\"m\">0.5 \u2013 2.5 ns</td><td class=\"m\">$2000 \u2013 $5000</td></tr>\n<tr><td>DRAM</td><td class=\"m\">50 \u2013 70 ns</td><td class=\"m\">$20 \u2013 $75</td></tr>\n<tr><td>Magnetic disk</td><td class=\"m\">5 \u2013 20 ms</td><td class=\"m\">$0.20 \u2013 $2</td></tr>\n</table></div>\n<p>The ideal memory would have SRAM's speed at disk's cost. The hierarchy is how we fake exactly that.</p>\n\n<h3>SRAM vs DRAM</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th></th><th>DRAM</th><th>SRAM</th></tr>\n<tr><td>Per bit</td><td>1 capacitor + 1 transistor</td><td>6\u20138 transistors</td></tr>\n<tr><td>Refresh</td><td>Yes \u2014 the charge leaks, so it must be read and written back regularly</td><td>No \u2014 holds its value while power is on</td></tr>\n<tr><td>Used for</td><td class=\"m\">Main memory</td><td class=\"m\">Registers, L1, L2, L3</td></tr>\n</table></div>\n<p>The \"D\" comes from that refreshing: <strong>Dynamic</strong> RAM. SRAM is <strong>Static</strong> because nothing has to move to keep the value.</p>"}, {"name": "Cache vocabulary", "mins": "12 / 20 min", "lesson": "\n<h2>The words you get marked on</h2>\n\n<h3>Block (or line)</h3>\n<p>The <strong>minimum unit of information that can be either present or not present in a cache</strong>. The cache never holds half a block. On a miss, a whole block comes in.</p>\n\n<h3>Hit and miss</h3>\n<ul>\n<li><strong>Hit</strong> \u2014 the data asked for <em>is</em> in the upper level (the cache).</li>\n<li><strong>Miss</strong> \u2014 it is not, so the lower level is accessed to fetch the block containing it.</li>\n</ul>\n\n<h3>The four measurements</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Term</th><th>Meaning</th><th>Formula</th></tr>\n<tr><td><strong>Hit rate</strong></td><td>Share of accesses found in the cache</td><td class=\"m\">hits \u00f7 total accesses</td></tr>\n<tr><td><strong>Miss rate</strong></td><td>Share not found</td><td class=\"m\">misses \u00f7 total = 1 \u2212 hit rate</td></tr>\n<tr><td><strong>Hit time</strong></td><td>Time to access the cache, <em>including</em> deciding whether it is a hit or a miss</td><td class=\"m\">small</td></tr>\n<tr><td><strong>Miss penalty</strong></td><td>Time to replace a block in the upper level with the one from the lower level, <em>plus</em> deliver it to the processor</td><td class=\"m\">large</td></tr>\n</table></div>\n<div class=\"note\"><b>Careful with hit time.</b> It includes the checking. That is why a miss costs hit time <em>plus</em> the penalty, not just the penalty.</div>\n\n<h3>What makes a good cache</h3>\n<p>Two goals: <strong>increase the hit rate</strong> and <strong>reduce the miss penalty</strong>. Everything in the chapter is one or the other.</p>\n\n<h3>Three ways to organise a cache</h3>\n<ol class=\"steps\">\n<li><strong>Direct mapped</strong> \u2014 each memory block has exactly one place it can go. Simplest, fastest lookup. This is the one we compute with.</li>\n<li><strong>Fully associative</strong> \u2014 a block can go anywhere in the cache.</li>\n<li><strong>Set associative</strong> \u2014 a block can go anywhere inside one small set.</li>\n</ol>\n<p>Direct mapped is easy to build, but has one weakness: <strong>if two memory blocks map to the same cache block, one overwrites the other</strong> \u2014 even when the rest of the cache is empty.</p>"}, {"name": "Direct mapping", "mins": "15 / 25 min", "lesson": "\n<h2>Which cache slot does a block go to?</h2>\n<div class=\"syntax\">Cache Index = Block address MOD number of blocks in the cache</div>\n\n<h3>Worked mapping \u2014 an 8-block cache</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Memory block</th><th>Working</th><th>Cache index</th></tr>\n<tr><td class=\"m\">00001 (1)</td><td class=\"m\">1 mod 8 = 1</td><td class=\"m\">001</td></tr>\n<tr><td class=\"m\">00101 (5)</td><td class=\"m\">5 mod 8 = 5</td><td class=\"m\">101</td></tr>\n<tr><td class=\"m\">01001 (9)</td><td class=\"m\">9 mod 8 = 1</td><td class=\"m\">001</td></tr>\n<tr><td class=\"m\">01101 (13)</td><td class=\"m\">13 mod 8 = 5</td><td class=\"m\">101</td></tr>\n<tr><td class=\"m\">10001 (17)</td><td class=\"m\">17 mod 8 = 1</td><td class=\"m\">001</td></tr>\n<tr><td class=\"m\">11001 (25)</td><td class=\"m\">25 mod 8 = 1</td><td class=\"m\">001</td></tr>\n<tr><td class=\"m\">11101 (29)</td><td class=\"m\">29 mod 8 = 5</td><td class=\"m\">101</td></tr>\n</table></div>\n<p>Blocks 1, 9, 17 and 25 all want index <strong>001</strong>. They take turns evicting each other \u2014 that is the weakness of direct mapping.</p>\n\n<h3>The shortcut that saves you time</h3>\n<div class=\"note\"><b>mod 2\u207f = just take the last n bits.</b> No division. 8 blocks = 2\u00b3 \u2192 the index is the last <strong>3</strong> bits. 16 blocks = 2\u2074 \u2192 last 4 bits. This works because every cache size in this course is a power of two.</div>\n<pre class=\"code\">Cache = 16 blocks, block address = 125\n125 = 1111101\nlast 4 bits = <b>1101</b> = 13\n\nCache = 4 blocks, block address = 129\n129 = 1000 0001\nlast 2 bits = <b>01</b> = 1</pre>\n\n<h3>Larger blocks \u2014 the slide's example</h3>\n<pre class=\"code\">64 blocks, 16 bytes per block.\nTo which block number does address 1200 map?\n\nBlock address = \u230a1200 / 16\u230b = 75\nBlock number  = 75 mod 64 = <b>11</b></pre>\n<div class=\"kid\"><b>Two steps, always in this order:</b> first turn the byte address into a block address by dividing by the block size (and rounding DOWN). Then mod by the number of blocks.</div>\n\n<h3>Key facts</h3>\n<ul>\n<li>One memory block has <strong>exactly one</strong> possible cache slot.</li>\n<li>Many memory blocks share that slot \u2014 a <strong>conflict</strong>.</li>\n<li>The index says <em>where to look</em>. It does <strong>not</strong> say whether the right data is there \u2014 that is the tag's job.</li>\n</ul>"}, {"name": "Address bits", "mins": "25 / 40 min", "lesson": "\n<h2>Splitting the address: tag, index, offset</h2>\n<div class=\"row\"><span class=\"row-name\">Memory address \u2014 the order is FIXED</span>\n<span class=\"bits\" style=\"grid-template-columns:5fr 3fr 2fr\">\n<span>Tag<i>is this the right block?</i></span><span>Index<i>which cache row?</i></span><span>Offset<i>which byte inside?</i></span></span></div>\n\n<h3>The four formulas</h3>\n<div class=\"syntax\">Index bits  = log\u2082(number of cache blocks)\nOffset bits = log\u2082(block size in BYTES)\nTag bits    = total address bits \u2212 index bits \u2212 offset bits\nBlock address = \u230a memory address \u00f7 block size in bytes \u230b      always floor</div>\n\n<h3>The valid bit</h3>\n<p>Every cache block also carries a <strong>valid bit</strong>: 1 bit per block. 0 = empty or outdated, 1 = holds real data.</p>\n<div class=\"note\"><b>Exam trap.</b> The valid bit is <strong>not part of the memory address</strong>. Never include it when tag + index + offset must add up.</div>\n\n<h3>Worked 1 \u2014 plain</h3>\n<pre class=\"code\">Cache has 64 blocks   \u2192 index  = log\u2082(64) = <b>6 bits</b>\nBlock size 16 bytes   \u2192 offset = log\u2082(16) = <b>4 bits</b>\nAddress is 32 bits    \u2192 tag    = 32 \u2212 6 \u2212 4 = <b>22 bits</b></pre>\n\n<h3>Worked 2 \u2014 sizes given in BITS</h3>\n<pre class=\"code\">Cache = 16 blocks, block size = 64 bits, address = 320\n\nBlock size 64 bits = <b>8 bytes</b>\nindex  = log\u2082(16) = 4\noffset = log\u2082(8)  = 3\n320 = 101000000  \u2192 9 bits total\ntag = 9 \u2212 4 \u2212 3 = 2\n\n Tag | Index | Offset\n  10 | 1000  |  000\n\nCheck the other way:\nBlock address = \u230a320 / 8\u230b = 40\nIndex = 40 mod 16 = 8 = 1000 \u2713</pre>\n\n<h3>Worked 3 \u2014 the practice-sheet style</h3>\n<pre class=\"code\">Block size = 32 bits, cache size = 64 bits, address = 239\n\nBlock size = 32 bits = <b>4 bytes</b>\nCache size = 64 bits = 8 bytes\nNumber of blocks = 8 \u00f7 4 = <b>2 blocks</b>\nBlock address = \u230a239 / 4\u230b = \u230a59.75\u230b = 59\nIndex = 59 mod 2 = <b>1</b></pre>\n\n<h3>Worked 4 \u2014 full breakdown</h3>\n<pre class=\"code\">Block size = 8 bits, cache size = 32 bits, address = 297\n\nBlock size = 8 bits = 1 byte\nCache size = 32 bits = 4 bytes \u2192 4 \u00f7 1 = <b>4 blocks</b>\nindex  = log\u2082(4) = 2 bits\noffset = log\u2082(1) = <b>0 bits</b>   \u2190 no offset field at all\n297 = 100101001 \u2192 9 bits\ntag = 9 \u2212 2 \u2212 0 = 7 bits\n\n Tag      | Index\n 1001010  |  01</pre>\n<div class=\"note\"><b>Two traps in this one question.</b> Sizes given in <em>bits</em> \u2014 convert to bytes first. And a 1-byte block gives log\u2082(1) = 0 offset bits, which is perfectly legal: the address simply has no offset field.</div>"}, {"name": "Hit or miss \u00b7 Blocks", "mins": "20 / 30 min", "lesson": "\n<h2>Reading the cache table</h2>\n<ol class=\"steps\">\n<li>Split the address into <strong>tag / index / offset</strong>.</li>\n<li>Use the <strong>index</strong> to jump to that row.</li>\n<li>If <strong>valid bit = 1 AND the tag matches</strong> \u2192 <strong>HIT</strong>. Anything else \u2192 <strong>MISS</strong>.</li>\n</ol>\n<p>On a miss the block is fetched from memory into that row: the valid bit becomes 1 and the tag is overwritten. The old block is gone.</p>\n<div class=\"note\"><b>The two ways to miss.</b> Valid bit = 0 (nothing there yet), or valid bit = 1 but the tag is different (someone else's block is in your slot). Students lose marks by checking only the valid bit.</div>\n\n<h3>Try it \u2014 8 blocks, 1-byte blocks, 6-bit addresses</h3>\n<p>Index = 3 bits, offset = 0 bits, tag = 6 \u2212 3 = 3 bits. Step through the five accesses and watch the table change.</p>\n<div class=\"sim\" id=\"sim\"></div>\n\n<h3>Then the ratios</h3>\n<div class=\"syntax\">Hit ratio  = total hits \u00f7 total accesses\nMiss ratio = total misses \u00f7 total accesses = 1 \u2212 hit ratio</div>\n<p>For those five accesses: 2 hits, 3 misses \u2192 hit ratio = <strong>2/5</strong>, miss ratio = <strong>3/5</strong>.</p>\n\n<h3>Block size \u2014 why bigger helps, then hurts</h3>\n<p><strong>Helps:</strong> spatial locality. Touch address A and A+1, A+2 arrive free in the same block, so you go to memory less often.</p>\n<p><strong>Hurts</strong>, once the total cache size is fixed:</p>\n<ol class=\"steps\">\n<li><strong>Fewer blocks</strong> \u2192 more data fighting for fewer slots \u2192 more conflict misses.</li>\n<li><strong>Cache pollution</strong> \u2192 you dragged in a big block, used a few bytes, and evicted something useful.</li>\n<li><strong>Bigger miss penalty</strong> \u2192 more data to fetch on every miss. This can cancel out the lower miss rate completely.</li>\n</ol>\n<div class=\"kid\"><b>Shape to remember:</b> miss rate falls as block size grows, then rises again. There is a sweet spot in the middle \u2014 bigger is not automatically better.</div>\n\n<h3>Two ways to soften the penalty</h3>\n<ul>\n<li><strong>Early restart</strong> \u2014 send data to the CPU as soon as the requested word arrives; don't wait for the whole block.</li>\n<li><strong>Critical-word-first</strong> \u2014 ask for the word you actually need <em>first</em>, even if it sits in the middle of the block. The rest loads in the background.</li>\n</ul>\n\n<h3>What happens on a miss</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Type</th><th>What happened</th><th>What the CPU does</th></tr>\n<tr><td><strong>Instruction cache miss</strong></td><td>An instruction fetch was not in the cache</td><td>Stall the pipeline, fetch the block, then <strong>restart the instruction fetch</strong></td></tr>\n<tr><td><strong>Data cache miss</strong></td><td>A load referred to data not in the cache</td><td>Stall, fetch the block, then <strong>complete the data access</strong></td></tr>\n</table></div>"}, {"name": "Writes \u00b7 AMAT", "mins": "25 / 35 min", "lesson": "\n<h2>Writing, and measuring the whole thing</h2>\n<p>Reading is easy. Writing raises a question: when the CPU changes a value, <strong>who else needs to know?</strong> The answer depends on whether the address is already in the cache.</p>\n\n<h3>Write HIT \u2014 the address is already in the cache</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th></th><th>Write-Through</th><th>Write-Back</th></tr>\n<tr><td>Updates</td><td>Cache <strong>and</strong> main memory together</td><td><strong>Only</strong> the cache</td></tr>\n<tr><td>Memory gets it</td><td>Immediately</td><td>Later \u2014 when that block is replaced</td></tr>\n<tr><td>Good</td><td>Always in sync, memory always up to date, reliable</td><td>Faster \u2014 one write per change</td></tr>\n<tr><td>Bad</td><td>Slower \u2014 every write touches slow memory, writes happen twice</td><td>Memory is stale for a while, so data can be lost</td></tr>\n</table></div>\n\n<h3>The dirty bit</h3>\n<p>Write-back needs to know whether a block was changed. That is the <strong>dirty bit</strong>. When the CPU writes to a block it is marked dirty. When that block is about to be replaced: dirty \u2192 write it back to memory first; clean \u2192 just overwrite it, memory already matches.</p>\n\n<h3>The write buffer</h3>\n<ul>\n<li><strong>With write-through:</strong> holds data waiting to go to memory so the CPU carries on instead of stalling. It only stalls if the buffer fills.</li>\n<li><strong>With write-back:</strong> holds the dirty block being evicted, so the new block can start loading immediately and the old one is written out in the background.</li>\n</ul>\n\n<h3>Write MISS \u2014 the address is NOT in the cache</h3>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th></th><th>Write Allocation</th><th>No-Write Allocation</th></tr>\n<tr><td>What happens</td><td>Fetch the block into the cache <strong>first</strong>, then write into it using write-through or write-back</td><td>Write <strong>straight to main memory</strong>; the block is never loaded</td></tr>\n<tr><td>Good when</td><td>You will touch this block again soon</td><td>You write once and move on (e.g. initialising an array)</td></tr>\n</table></div>\n<div class=\"note\"><b>Keep the two questions apart.</b> Write-through vs write-back answers \"what on a write <em>hit</em>\". Write allocate vs no-write allocate answers \"what on a write <em>miss</em>\". Mixing these up is the classic mistake.</div>\n<p><strong>Combinations:</strong> write allocate + write-back is the common real-world pairing. <strong>Write around = write-through + no-write allocate.</strong></p>\n\n<h3>AMAT</h3>\n<div class=\"syntax\">AMAT = Hit time + (Miss rate \u00d7 Miss penalty)</div>\n<p>Read it as English: every access pays the hit time; the fraction that miss also pay the penalty on top.</p>\n<pre class=\"code\">CPU clock = 1 ns, hit time = 1 cycle,\nmiss penalty = 20 cycles, miss rate = 5%\n\nMiss penalty = 20 \u00d7 1 ns = 20 ns\nAMAT = 1 + (0.05 \u00d7 20) = 1 + 1 = <b>2 ns</b>\n1 ns = 1 cycle, so <b>2 cycles per instruction</b></pre>\n<pre class=\"code\">From 5 accesses: 2 hits, 3 misses \u2192 miss rate = 3/5\nhit time = 2 s, miss penalty = 5 s\n\nAMAT = 2 + (3/5 \u00d7 5) = 2 + 3 = <b>5 s</b>\n\nCPU clock = 2 s  \u2192  2 s = 1 cycle\n                    5 s = 5/2 = <b>2.5 cycles per instruction</b></pre>\n<div class=\"note\"><b>The units step is worth marks on its own.</b> Convert the penalty into the same unit as the hit time BEFORE adding. Then divide the AMAT by the clock period to get cycles.</div>\n\n<h3>Why AMAT matters more as CPUs get faster</h3>\n<ul>\n<li>Lower base CPI \u2192 a greater proportion of time is spent on memory stalls.</li>\n<li>Higher clock rate \u2192 memory stalls account for more CPU cycles.</li>\n<li>So as the CPU improves, the <strong>miss penalty becomes more significant</strong>, not less.</li>\n</ul>\n\n<h3>Multilevel cache</h3>\n<pre class=\"code\">Core-1   Core-2   Core-3   Core-4\n  L1       L1       L1       L1     \u2190 private, tiny, built for speed\n  L2       L2       L2       L2     \u2190 bigger, catches L1 misses\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 L3 (shared) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500  \u2190 biggest, last stop before RAM</pre>\n<div class=\"tblwrap\"><table class=\"tbl\">\n<tr><th>Level</th><th>Designed for</th><th>Consequence</th></tr>\n<tr><td>L1 (primary)</td><td>minimal <strong>hit time</strong></td><td>smaller, and a smaller block size than L2</td></tr>\n<tr><td>L2 / L3</td><td>low <strong>miss rate</strong>, to avoid going to main memory</td><td>larger, slower; hit time matters less</td></tr>\n</table></div>\n<p>Each level exists to <strong>reduce the miss penalty of the level above it</strong>. An L1 miss no longer means a trip to main memory \u2014 it means a trip to L2, which is far cheaper.</p>"}]}]};

{src:"Sheet 2 · Q1", fmt:"Coding + Encoding", mins:12,
 t:"Arrays, indirection, and encoding",
 q:`<p>Construct the equivalent RISC-V code of the following C code. Once you have the RISC-V code, <strong>identify the type of each instruction and encode them accordingly.</strong></p>
<pre class="code">A[7] = A[2] + A[B[8]] + 10;
B[i] = A[3] - 8;</pre>
<div class="given"><b>Given:</b> base addresses of array A and B are in <code>X20</code> and <code>X21</code>, and <code>i</code> is in <code>X22</code>.</div>`,
 sol:`<p><strong>Line 1 — A[7] = A[2] + A[B[8]] + 10;</strong></p>
<pre class="code"><b>ld   x5, 64(x21)</b>    <i>// B[8]        (8 × 8 = 64)</i>
<b>slli x5, x5, 3</b>      <i>// offset calculation (x5 × 2³)</i>
<b>add  x6, x20, x5</b>    <i>// physical location (base + offset)</i>
<b>ld   x6, 0(x6)</b>      <i>// A[B[8]]</i>

<b>ld   x5, 16(x20)</b>    <i>// A[2]</i>
<b>add  x5, x5, x6</b>     <i>// A[B[8]] + A[2]</i>
<b>addi x5, x5, 10</b>     <i>// A[B[8]] + A[2] + 10</i>
<b>sd   x5, 56(x20)</b>    <i>// A[7] = result   (7 × 8 = 56)</i></pre>
<p><strong>Line 2 — B[i] = A[3] − 8;</strong></p>
<pre class="code"><b>ld   x6, 24(x20)</b>    <i>// A[3]</i>
<b>addi x6, x6, -8</b>     <i>// A[3] − 8</i>
<b>slli x7, x22, 3</b>     <i>// offset calc  ⇒ x22 × 2³</i>
<b>add  x7, x7, x21</b>    <i>// physical address</i>
<b>sd   x6, 0(x7)</b>      <i>// B[i] = A[3] − 8</i></pre>
<p><strong>Instruction types</strong></p>
<div class="tblwrap"><table class="tbl">
<tr><th>#</th><th>Instruction</th><th>Type</th></tr>
<tr><td class="m">1</td><td class="m">ld x5, 64(x21)</td><td class="m">I</td></tr>
<tr><td class="m">2</td><td class="m">slli x5, x5, 3</td><td class="m">I</td></tr>
<tr><td class="m">3</td><td class="m">add x6, x20, x5</td><td class="m">R</td></tr>
<tr><td class="m">4</td><td class="m">ld x6, 0(x6)</td><td class="m">I</td></tr>
<tr><td class="m">5</td><td class="m">ld x5, 16(x20)</td><td class="m">I</td></tr>
<tr><td class="m">6</td><td class="m">add x5, x5, x6</td><td class="m">R</td></tr>
<tr><td class="m">7</td><td class="m">addi x5, x5, 10</td><td class="m">I</td></tr>
<tr><td class="m">8</td><td class="m">sd x5, 56(x20)</td><td class="m">S</td></tr>
<tr><td class="m">9</td><td class="m">ld x6, 24(x20)</td><td class="m">I</td></tr>
<tr><td class="m">10</td><td class="m">addi x6, x6, -8</td><td class="m">I</td></tr>
<tr><td class="m">11</td><td class="m">slli x7, x22, 3</td><td class="m">I</td></tr>
<tr><td class="m">12</td><td class="m">add x7, x7, x21</td><td class="m">R</td></tr>
<tr><td class="m">13</td><td class="m">sd x6, 0(x7)</td><td class="m">S</td></tr>
</table></div>
<p><strong>Encodings the sheet works out</strong> (opcode / funct3 / funct7 were not given, so they are written as X):</p>
<pre class="code">1. ld x5, 64(x21)     I-type
   0000 0100 0000 | 10101 | XXX | 00101 | XXXXXXX
      imm = 64        rs1   funct3   rd    opcode

2. slli x5, x5, 3     I-type (modified)
   0000 00 | 00 0011 | 00101 | XXX | 00101 | XXXXXXX
   funct6    shamt=3     rs1   funct3   rd    opcode

3. add x6, x20, x5    R-type
   XXXXXXX | 00101 | 10100 | XXX | 00110 | XXXXXXX
    funct7    rs2     rs1   funct3   rd    opcode

8. sd x5, 56(x20)     S-type
   0000 001 | 00101 | 10100 | XXX | 1 1000 | XXXXXXX
   imm[11:5]   rs2     rs1   funct3 imm[4:0] opcode

10. addi x6, x6, -8   I-type
   1111 1111 1000 | 00110 | XXX | 00110 | XXXXXXX
       imm = −8        rs1   funct3   rd    opcode

   working for −8:   8 = 1000
                    +8 = 0000 0000 1000
                  flip = 1111 1111 0111
                    +1 = 1111 1111 1000  = −8</pre>
<div class="note"><b>The sheet stops there</b> — it says "encode rest of the instructions yourself". The five above give you every pattern you need: I with a plain immediate, I modified for a shift, R, S with its split immediate, and I with a negative immediate.</div>`},

{src:"Sheet 2 · Q2", fmt:"Coding", mins:10,
 t:"A for-loop with an if inside",
 q:`<p>Construct the equivalent RISC-V code of the following C code.</p>
<pre class="code">for (i = 8; i &gt; 0 ; i--) {
    if ( A[i] == i ) {
        A[2] = A[B[3]];
    }
}</pre>
<div class="given"><b>Given:</b> base addresses of A and B are in <code>X20</code> and <code>X21</code>. <code>i</code> is in <code>X22</code>.</div>`,
 sol:`<pre class="code"><b>Addi x22, x0, 8</b>          <i>// i = 8</i>

Loop:
  <b>Beq  x22, x0, Exit</b>     <i>// i &gt; 0 fails when i == 0</i>

  If:
  <b>Slli x5, x22, 3</b>        <i>// offset calc</i>
  <b>Add  x5, x5, x20</b>       <i>// base + offset</i>
  <b>Ld   x6, 0(x5)</b>         <i>// x6 = A[i]</i>
  <b>Bne  x6, x22, inc</b>      <i>// if A[i] != i, skip the body</i>

  <b>Ld   x7, 24(x21)</b>       <i>// x7 = B[3]</i>
  <b>Slli x7, x7, 3</b>         <i>// x7 = x7 × 2³</i>
  <b>Add  x7, x7, x20</b>       <i>// base + offset</i>
  <b>Ld   x5, 0(x7)</b>         <i>// x5 = A[B[3]]</i>
  <b>Sd   x5, 16(x20)</b>       <i>// A[2] = x5</i>

inc:
  <b>Addi x22, x22, -1</b>      <i>// i--</i>
  <b>Beq  x0, x0, Loop</b>

Exit:</pre>
<div class="note"><b>Shape to copy:</b> set the counter → label → exit test → body → increment label → jump back. The <code>inc:</code> label exists so that a failed <code>if</code> still decrements the counter; jumping straight to <code>Loop</code> would hang forever.</div>`},

{src:"Sheet 2 · Q4", fmt:"Coding", mins:10,
 t:"Nested if / else",
 q:`<p>Construct the equivalent RISC-V code of the following C code.</p>
<pre class="code">if ( A[3] != A[6] ) {
    if ( A[3] == 0 ) {
        A[3] = A[3] + 2;
    } else {
        A[6] = A[6] / 16;
    }
} else {
    A[6] = A[6] * 8;
}</pre>
<div class="given"><b>Given:</b> base address of array A is in <code>X20</code>.</div>`,
 sol:`<pre class="code">If1:
  <b>Ld  x28, 24(x20)</b>       <i>// x28 = A[3]</i>
  <b>Ld  x29, 48(x20)</b>       <i>// x29 = A[6]</i>
  <b>Beq x28, x29, Else1</b>    <i>// flip !=  →  beq</i>

If2:
  <b>Ld  x5, 24(x20)</b>        <i>// x5 = A[3]</i>
  <b>Bne x5, x0, Else2</b>      <i>// flip ==  →  bne</i>
  <b>Addi x5, x5, 2</b>
  <b>Sd  x5, 24(x20)</b>        <i>// A[3] = x5 + 2</i>
  <b>Beq x0, x0, Exit</b>

Else2:
  <b>Ld   x5, 48(x20)</b>       <i>// x5 = A[6]</i>
  <b>Srli x5, x5, 4</b>         <i>// x5 = x5 / 2⁴  = /16</i>
  <b>Sd   x5, 48(x20)</b>       <i>// A[6] = x5</i>
  <b>Beq  x0, x0, Exit</b>

Else1:
  <b>Ld   x28, 48(x20)</b>      <i>// x28 = A[6]</i>
  <b>Slli x28, x28, 3</b>       <i>// x28 = x28 × 8</i>
  <b>Sd   x28, 48(x20)</b>      <i>// A[6] = x28</i>

Exit:</pre>
<div class="note"><b>Two things the sheet points out.</b> A[3] is already loaded into x5 and nothing has changed it, so the reload is only for clarity. And ÷16 becomes <code>srli … 4</code>, ×8 becomes <code>slli … 3</code> — never use a divide or multiply instruction when the constant is a power of two.</div>`},

{src:"Sheet 2 · Q16", fmt:"Decoding", mins:8,
 t:"Where does the Exit label go?",
 q:`<pre class="code">bge  x22, x21, Exit       <i>\\\\ 0x015B1A67</i>
slli x5, x22, 3
add  x5, x20, x5
ld   x10, 0(x5)
addi x10, x10, -1
sd   x10, 0(x5)
addi x22, x22, 1</pre>
<p>The machine code of the first instruction is given beside the instruction. Based on that, <strong>deduce where the label "Exit" should be put.</strong></p>`,
 sol:`<p>Convert the hex to binary and lay it out in the <strong>SB-type</strong> format:</p>
<div class="tblwrap"><table class="tbl">
<tr><th>imm[12]</th><th>imm[10:5]</th><th>rs2</th><th>rs1</th><th>funct3</th><th>imm[4:1]</th><th>imm[11]</th><th>opcode</th></tr>
<tr><td class="m">0</td><td class="m">000000</td><td class="m">10101</td><td class="m">10110</td><td class="m">001</td><td class="m">1010</td><td class="m">0</td><td class="m">1100111</td></tr>
</table></div>
<pre class="code">The immediate  = 000000001010

Offset between addresses = 10100  [1 bit left shift] = 20
Offset between lines     = 20 / 4 = 5

So the "Exit" label goes 5 instructions down, onto:
   <b>sd x10, 0(x5)</b></pre>
<div class="note"><b>The two-step conversion is the whole question.</b> The 12-bit field holds the offset in <em>halfwords</em>, so shift left once to get bytes (20), then divide by 4 to get instructions (5). Miss either step and the label lands in the wrong place.</div>`},

{src:"Sheet 2 · Q18", fmt:"Coding", mins:8,
 t:"An arithmetic expression on a word array",
 q:`<p>Construct the equivalent <strong>RISC-V assembly</strong> for the following C statement:</p>
<pre class="code">A[5] = A[i] * 12 + B[i];</pre>
<div class="given"><b>Given:</b> base addresses of <b>A and B are in x20 and x21</b>. The value of <b>'i' is in x22</b> and the <b>data size is 4 bytes</b>.</div>`,
 sol:`<pre class="code"><b>slli x5, x22, 2</b>      <i>// x5 = i * 4  (offset for A[i])</i>
<b>add  x5, x20, x5</b>     <i>// x5 = address of A[i]</i>
<b>ld   x6, 0(x5)</b>       <i>// x6 = A[i]</i>

<i># Multiply A[i] * 12      # 12 = 8 + 4</i>
<b>slli x7, x6, 3</b>       <i>// x7 = A[i] * 8</i>
<b>slli x8, x6, 2</b>       <i>// x8 = A[i] * 4</i>
<b>add  x7, x7, x8</b>      <i>// x7 = A[i] * 12</i>

<b>slli x9, x22, 2</b>      <i>// offset for B[i]</i>
<b>add  x9, x21, x9</b>     <i>// address of B[i]</i>
<b>ld   x10, 0(x9)</b>      <i>// x10 = B[i]</i>

<b>add  x11, x7, x10</b>    <i>// result = A[i]*12 + B[i]</i>

<b>addi x12, x0, 20</b>     <i>// offset for A[5]  (5 * 4)</i>
<b>add  x12, x20, x12</b>
<b>sd   x11, 0(x12)</b>     <i>// store result into A[5]</i></pre>
<div class="note"><b>Data size 4 bytes</b> ⇒ <code>slli</code> by <strong>2</strong> and A[5] sits at 5 × 4 = <strong>20</strong>. And ×12 is done as 8 + 4 — two shifts and an add, no multiply instruction.</div>`},

{src:"Sheet 2 · Q20", fmt:"Encoding", mins:8,
 t:"SB-type machine code with don't-cares",
 q:`<p>Given the following RISC-V instructions, write their <strong>32-bit machine code in binary</strong>. Put <strong>Don't care (X)</strong> where necessary (as opcode, funct3 or funct7 value is not given).</p>
<pre class="code">BEQ x6, x0, target1    <i>(Assume target1 is 32 bytes ahead of the current PC.)</i>
BNE x10, x11, target2  <i>(Assume target2 is 64 bytes before the current PC.)</i></pre>`,
 sol:`<p><strong>BEQ x6, x0, target1</strong></p>
<pre class="code">Offset = 32 bytes → divide by 2 (the LSB / 13th bit is always discarded)
imm = 32 / 2 = 16 → <b>000000010000</b>  (12 bits)</pre>
<div class="tblwrap"><table class="tbl">
<tr><th>Field</th><th>Bits</th><th>Value</th></tr>
<tr><td class="m">imm[12]</td><td class="m">31</td><td class="m">0</td></tr>
<tr><td class="m">imm[10:5]</td><td class="m">30–25</td><td class="m">000001</td></tr>
<tr><td class="m">rs2</td><td class="m">24–20</td><td class="m">00000</td></tr>
<tr><td class="m">rs1</td><td class="m">19–15</td><td class="m">00110</td></tr>
<tr><td class="m">funct3</td><td class="m">14–12</td><td class="m">xxx</td></tr>
<tr><td class="m">imm[4:1]</td><td class="m">11–8</td><td class="m">0000</td></tr>
<tr><td class="m">imm[11]</td><td class="m">7</td><td class="m">0</td></tr>
<tr><td class="m">opcode</td><td class="m">6–0</td><td class="m">xxxxxxx</td></tr>
</table></div>
<pre class="code">Machine code: <b>0 000001 00000 00110 xxx 0000 0 xxxxxxx</b></pre>
<p><strong>BNE — 64 bytes before the current PC</strong></p>
<pre class="code">Offset = −64 bytes → divide by 2
imm = −64 / 2 = −32 → 12-bit 2's complement: <b>111111100000</b></pre>
<div class="tblwrap"><table class="tbl">
<tr><th>Field</th><th>Bits</th><th>Value</th></tr>
<tr><td class="m">imm[12]</td><td class="m">31</td><td class="m">1</td></tr>
<tr><td class="m">imm[10:5]</td><td class="m">30–25</td><td class="m">111110</td></tr>
<tr><td class="m">rs2</td><td class="m">24–20</td><td class="m">00000</td></tr>
<tr><td class="m">rs1</td><td class="m">19–15</td><td class="m">00110</td></tr>
<tr><td class="m">funct3</td><td class="m">14–12</td><td class="m">xxx</td></tr>
<tr><td class="m">imm[4:1]</td><td class="m">11–8</td><td class="m">0000</td></tr>
<tr><td class="m">imm[11]</td><td class="m">7</td><td class="m">1</td></tr>
<tr><td class="m">opcode</td><td class="m">6–0</td><td class="m">xxxxxxx</td></tr>
</table></div>
<pre class="code">Machine code: <b>1 111110 00000 00110 xxx 0000 1 xxxxxxx</b></pre>
<div class="note"><b>Heads up:</b> the solution sheet encodes the second instruction as <code>BNE x6, x0</code> (rs1 = 00110, rs2 = 00000) rather than the <code>x10, x11</code> printed in the question. The <strong>immediate working is the part being examined</strong>; if your exam gives x10 and x11, use rs1 = 01010 and rs2 = 01011 and keep everything else identical.</div>`},

{src:"Sheet 2 · Q22", fmt:"Coding", mins:10,
 t:"A function with a stack frame",
 q:`<p>Translate the following <strong>C code</strong> into <strong>RISC-V assembly</strong>.</p>
<pre class="code">int multiply_add(int a, int b) {
   int c;
   c = a * 4;
   return c + b;
}

int main() {
   int x = 6;
   int y = 9;
   int z;
   z = multiply_add(x, y);
}</pre>
<div class="given"><b>Assume:</b> x → x20, y → x21, z → x22. Function arguments → x10, x11. Return value → x10. Stack pointer → x2. a → x13, b → x14, c → x15.<br><b>NB:</b> store and restore x13–x15 in the stack during the procedure.</div>`,
 sol:`<pre class="code"><i># main function</i>
<b>addi x20, x0, 6</b>            <i># x = 6</i>
<b>addi x21, x0, 9</b>            <i># y = 9</i>

<b>addi x10, x20, 0</b>           <i># pass x as argument a</i>
<b>addi x11, x21, 0</b>           <i># pass y as argument b</i>
<b>jal  x1, multiply_add</b>      <i># call leaf procedure</i>

<b>addi x22, x10, 0</b>           <i># z = return value</i>

multiply_add:
  <b>addi x2, x2, -24</b>         <i># allocate 24 bytes for x13, x14, x15</i>
  <b>sd   x13, 0(x2)</b>          <i># save x13 (a) on stack</i>
  <b>sd   x14, 8(x2)</b>          <i># save x14 (b) on stack</i>
  <b>sd   x15, 16(x2)</b>         <i># save x15 (c) on stack</i>

  <b>addi x13, x10, 0</b>         <i># move argument a to x13</i>
  <b>addi x14, x11, 0</b>         <i># move argument b to x14</i></pre>
<div class="note"><b>The solution sheet stops at this line.</b> The remaining lines follow the standard pattern exactly — finish it like this:</div>
<pre class="code">  <b>slli x15, x13, 2</b>         <i># c = a * 4</i>
  <b>add  x10, x15, x14</b>       <i># return value = c + b</i>

  <b>ld   x13, 0(x2)</b>          <i># restore</i>
  <b>ld   x14, 8(x2)</b>
  <b>ld   x15, 16(x2)</b>
  <b>addi x2, x2, 24</b>          <i># give the stack room back</i>
  <b>jalr x0, 0(x1)</b>           <i># return to caller</i></pre>
<div class="kid"><b>Three registers = 24 bytes.</b> Each register is 64 bits = 8 memory locations, so 3 × 8 = 24, negative going in and positive coming out. And <code>a * 4</code> is <code>slli … 2</code>, never a multiply.</div>`}
],

CH3:[
{src:"Sheet 3 · Q5", fmt:"Math", mins:8,
 t:"Biased exponent in a custom format",
 q:`<p>Find the <strong>Biased Exponent</strong> of <code>5678.898</code> in a <strong>34-bit IEEE-754 format</strong> where the size of the exponent field is <strong>10 bits</strong>.</p>`,
 sol:`<pre class="code">5678.898
= 1 0110 0010 1110 . 1110 0101 11 . . .
= <b>1.0110 0010 1110 1110 × 2¹²</b>        ← actual exponent = 12

Bias = 2^(10−1) − 1 = 2⁹ − 1 = <b>511</b>

Biased exponent = 511 + 12
                = <b>523</b>
                = <b>10 0000 1011</b>   (10 bits)</pre>
<div class="note"><b>Two steps, never skip either.</b> Normalize first to find the <em>actual</em> exponent (12 here, because the binary point moved 12 places left), then add the bias. The bias comes from the exponent field width — never assume 127.</div>`},

{src:"Sheet 3 · Q6", fmt:"Math", mins:10,
 t:"Full conversion into a custom 34-bit format",
 q:`<p>Convert <code>-0.00987₁₀</code> into a <strong>34-bit IEEE-754 floating point representation</strong> where the size of the <strong>fraction field is 23 bits</strong>.</p>
<div class="tblwrap"><table class="tbl"><tr><th>sign bit</th><th>exponent</th><th>fraction</th></tr><tr><td class="m">&nbsp;</td><td class="m">&nbsp;</td><td class="m">&nbsp;</td></tr></table></div>`,
 sol:`<p>First work out the field widths: 34 total − 1 sign − 23 fraction = <strong>10 exponent bits</strong>.</p>
<div class="row"><span class="row-name">34-bit layout</span>
<span class="bits" style="grid-template-columns:1fr 10fr 23fr">
<span>S<i>1</i></span><span>Exponent<i>10</i></span><span>Fraction<i>23</i></span></span></div>
<pre class="code">0.00987 = 0.0000 0010 10 . . . . . .
        = <b>1.010 . . . × 2⁻⁷</b>          ← actual exponent = −7

Bias = 2^(10−1) − 1 = <b>511</b>

Biased Exponent = 511 + (−7) = <b>504</b> = <b>01 1111 1000</b>

Sign bit = <b>1</b>   (the number is negative)

Fraction = <b>010 0000 0000 0000 0000 0000</b>   (23 bits, padded with 0s)</pre>
<pre class="code">Assembled:
 1 | 01 1111 1000 | 0100 0000 0000 0000 0000 000

Grouped into nibbles:  2  F  C  2  0  0  0  0  0

= <b>0x2FC200000</b>   (Ans)</pre>
<div class="note"><b>Why the hex has 9 digits.</b> 34 bits is not a multiple of 4, so the string is left-padded with two zeros to 36 bits before grouping. Expect this in any custom-width question.</div>`},

{src:"Sheet 3 · Q9(i)", fmt:"Math", mins:8,
 t:"IEEE-754 back to decimal",
 q:`<p>Convert the following <strong>IEEE-754 single-precision</strong> floating point number into decimal.</p>
<pre class="code">0xFF1205BA</pre>`,
 sol:`<pre class="code">= 1111 1111 0001 0010 0000 0101 1011 1010

split:  1 | 1111 1110 | 001 0010 0000 0101 1011 1010
        S    Biased Exp           Fraction

Bias = 2^(8−1) − 1 = 127
Biased exponent = 1111 1110 = <b>254</b>
∴ Actual exponent = 254 − 127 = <b>127</b>

Fraction = 0.001 0010 0000 0101 1011 1010
         = <b>0.1407 9976 0818 4814 4531</b>

Decimal value = (−1)¹ × (1 + 0.14079976081848144531) × 2¹²⁷
              = −1.1407 9976 0818 4814 4531 × 2¹²⁷
              = <b>−1.9409702 × 10³⁸</b>   (Ans)</pre>
<div class="note"><b>The formula is the whole answer:</b> value = (−1)^S × (1 + Fraction) × 2^(actual exponent). Read the sign, subtract the bias, convert the fraction, substitute.</div>`},

{src:"Sheet 3 · Q10(iv)", fmt:"Math", mins:10,
 t:"Multiply in single precision, check overflow",
 q:`<p>Multiply the given numbers using <strong>IEEE-754 single-precision</strong> floating-point representation. Check if the result has <strong>overflow or underflow</strong>.</p>
<pre class="code">1584.234₁₀  and  1584.234₁₀</pre>
<div class="given"><b>Note:</b> consider 10 decimal digits while converting from decimal to binary.</div>`,
 sol:`<pre class="code">1584  = 110 0011 0000
.234  = .0011 1011 11 . . . . .

1584.234 = 110 0011 0000 . 0011 1011 11 . . .
         = <b>1.10 0011 0000 0011 1011 11… × 2¹⁰</b>

Multiply — ADD the exponents, multiply the significands:

  1.100011…× 2¹⁰  ×  1.100011…× 2¹⁰
= 10.01100 × 2²⁰
= <b>1.0011 00 × 2²¹</b>              ← actual exponent = 21</pre>
<p><strong>Overflow / underflow check</strong></p>
<pre class="code">Bias = 2^(8−1) − 1 = 127
Biased Exponent = 127 + 21 = <b>148</b>

Range of biased exponent = 0 to 2⁸ − 1 = 0 to 255
                         = <b>1 to 254</b>   [0 and 255 are reserved]

1 &lt; 148 &lt; 254

Hence, <b>No overflow / underflow</b></pre>
<div class="note"><b>Notice the renormalize step.</b> 1.1000… × 1.1000… gives 10.011…, which has two digits before the point — so shift right once and bump the exponent from 20 to 21. Forgetting that costs the exponent, and therefore the whole overflow verdict.</div>`},

{src:"Sheet 3 · Q12(ii)", fmt:"Math", mins:10,
 t:"Multiply in an 18-bit format, check underflow",
 q:`<p>Multiply the given numbers using an <strong>18-bit IEEE-754 floating-point representation where the size of the fraction field is 12 bits</strong>. Check if the result has overflow or underflow.</p>
<pre class="code">0.000101₂ × 2⁻⁸⁵   and   10.1₂ × 2⁻⁹⁰</pre>`,
 sol:`<p>Field widths: 18 − 1 sign − 12 fraction = <strong>5 exponent bits</strong>.</p>
<pre class="code">Normalize both:

  0.000101 × 2⁻⁸⁵          10.1 × 2⁻⁹⁰
= 1.01 × 2^(−85−4)        = 1.01 × 2^(−90+1)
= <b>1.01 × 2⁻⁸⁹</b>              = <b>1.01 × 2⁻⁸⁹</b>

Multiply:
  1.01 × 2⁻⁸⁹  ×  1.01 × 2⁻⁸⁹
= (1.01 × 1.01) × 2^(−89−89)
= <b>1.1001 × 2⁻¹⁷⁸</b>            ← actual exponent = −178</pre>
<p><strong>Overflow / underflow check</strong></p>
<pre class="code">Bias = 2^(5−1) − 1 = <b>15</b>
Biased Exponent = 15 + (−178) = <b>−163</b>

Range of biased exponent = 0 to 2⁵ − 1 = 0 to 31
                         = <b>1 to 30</b>   [0 and 31 reserved]

−163 &lt; 1   (below the lower limit)

Hence, <b>Underflow</b></pre>
<div class="kid"><b>Direction check:</b> below 1 → <strong>underflow</strong> (too small to store). Above the upper limit → <strong>overflow</strong> (too big). Both are decided by the <em>biased</em> exponent, never the actual one.</div>`}
],
