<tr><td class="m">i</td><td class="m">ADD X21, X22, X23</td><td class="m"><b>1, 2, 4, 5, 7, 8</b></td></tr>
<tr><td class="m">iv</td><td class="m">ADDi X21, X22, 5</td><td class="m"><b>1, 2, 4, 5, 6, 7, 8</b></td></tr>
<tr><td class="m">v</td><td class="m">LD X21, 22(X21)</td><td class="m"><b>1, 2, 3, 4, 5, 6, 7, 8</b></td></tr>
</table></div>
<p>The sheet marks ii, iii, vi and vii as "try yourself". They follow directly:</p>
<div class="tblwrap"><table class="tbl">
<tr><th>#</th><th>Instruction</th><th>Components</th><th>Why</th></tr>
<tr><td class="m">ii, iii</td><td class="m">AND / OR</td><td class="m">1, 2, 4, 5, 7, 8</td><td>Same as ADD — they are all R-type.</td></tr>
<tr><td class="m">vi</td><td class="m">SD X21, 22(X21)</td><td class="m">1, 2, 3, 4, 5, 6, 7, 8</td><td>Same as LD: it needs the Imm Gen for the offset and the Data Memory to write into.</td></tr>
<tr><td class="m">vii</td><td class="m">BEQ X21, X22, End</td><td class="m">1, 2, 4, 5, 6, 7, 8</td><td>Needs Imm Gen for the branch offset, but <strong>no Data Memory</strong>.</td></tr>
</table></div>
<div class="kid"><b>The quick test.</b> PC, Instruction Memory, Register File, Control and ALU Control are in <em>every</em> answer. Then ask two questions: does it use an immediate or a label? → add Imm Gen. Does it touch data memory? → add Data Memory. Only <code>ld</code> and <code>sd</code> answer yes to the second.</div>`},

{src:"Sheet 4 · Q11", fmt:"Datapath", mins:8,
 t:"Modify the BEQ datapath so it works for BNE",
 q:`<p><strong>Modify</strong> the BEQ datapath so that it works for <strong>BNE</strong>.</p>
<p>This is the datapath you are starting from. Redraw it and change what needs changing.</p>`
 + DPFIG({cap:"Starting point: Zero goes straight into the AND gate, so the branch is taken when the two registers are EQUAL."}),
 sol:`<p>Start from what the branch must do, as a truth table:</p>
<div class="tblwrap"><table class="tbl">
<tr><th>Zero</th><th>Branch</th><th>Result</th></tr>
<tr class="on"><td class="m">0</td><td class="m">1</td><td class="m"><b>PC + target</b></td></tr>
<tr><td class="m">1</td><td class="m">1</td><td class="m">PC + 4</td></tr>
<tr><td class="m">0</td><td class="m">0</td><td class="m">PC + 4</td></tr>
<tr><td class="m">1</td><td class="m">0</td><td class="m">PC + 4</td></tr>
</table></div>
<p>Only the first row takes the branch, so the condition we need is:</p>
<div class="syntax">PCSrc = Zero' AND Branch        ( NOT Zero, ANDed with Branch )</div>
<p><strong>The modification:</strong> insert a <strong>NOT gate (inverter)</strong> on the <strong>Zero</strong> line, just before it enters the AND gate. Nothing else changes — the Branch input, the two Adds, the mux and the Control unit all stay exactly as they were.</p>
` + DPFIG({notZero:true, sig:[{n:"Branch",v:"1",x:474,y:46},{n:"ALUOp",v:"01",x:196,y:358},{n:"ALU op",v:"Sub 0110",x:350,y:234}], cap:"The only change: a NOT gate (red) on the Zero line before the AND gate. Everything else is untouched."}) + `
<p>Other labels on the sheet's diagram, worth copying into your own answer:</p>
<ul>
<li><strong>Branch (1 bit) = 1</strong> on the Control output</li>
<li>The ALU's <strong>ALU Op</strong> label is crossed out and replaced with <strong>Sub</strong></li>
<li><strong>ALU Control output = 0110</strong>, with <strong>ALUOp = 01</strong> going into it</li>
<li>Imm[31-0] → Immediate Generation Unit → "offset converted into a 64-bit value"</li>
</ul>
<div class="kid"><b>Why it works:</b> beq subtracts and branches when the answer <em>is</em> zero. bne wants the opposite — branch when the answer is <em>not</em> zero. Flip that one wire and everything else is already correct.</div>`},

{src:"Sheet 4 · Q13", fmt:"Scenario", mins:8,
 t:"A buggy AND gate replaced by XNOR",
 q:`<p>Suppose that in a buggy implementation of the RISC-V datapath, the <strong>AND gate for the branching decision was replaced with an XNOR gate</strong>. Describe how this error would affect the execution of the following instructions.</p>
<pre class="code">i.  SUB x1, x2, x3
ii. BEQ x1, x2, target</pre>`,
 sol:`<p>Work through all four combinations of Branch and Zero, remembering XNOR outputs 1 when the two inputs are the <strong>same</strong>:</p>
<p><strong>i. SUB x1, x2, x3 — Branch = 0</strong></p>
<pre class="code">Branch = 0 ; Zero = 0  ⇒  XNOR = 1 ⇒ Mux selects Data 1 → <u>Which causes error.</u>
Branch = 0 ; Zero = 1  ⇒  XNOR = 0 ⇒ Mux selects Data 0 → no error.</pre>
<p><strong>ii. BEQ x1, x2, target — Branch = 1</strong></p>
<pre class="code">Branch = 1 ; Zero = 0  ⇒  XNOR = 0 ⇒ Mux selects Data 0 → no error.
Branch = 1 ; Zero = 1  ⇒  XNOR = 1 ⇒ Mux selects Data 1 → no error.</pre>
<p><strong>Conclusion (the sheet's wording):</strong> "XNOR gate acting like AND gate for these two combos."</p>
<div class="note"><b>So only ONE case breaks.</b> A <code>sub</code> whose result happens to be <strong>non-zero</strong> (Zero = 0) with Branch = 0 wrongly selects the branch target, and the PC jumps somewhere it should not. If the subtraction produced zero, the bug happens to be harmless. For <code>beq</code>, XNOR behaves identically to AND, so branches still work correctly.</div>`},

{src:"Sheet 4 · Q16", fmt:"Datapath", mins:6,
 t:"Read the control bits off the given diagram",
 q:`<p><strong>Determine</strong> the values of the following control bits when executing the instruction <strong>"Add X21, X22, X23"</strong> in the provided single-cycle datapath.</p>
<div class="given"><b>Critical:</b> in this particular figure the mux inputs are labelled the <strong>opposite way round</strong> from the textbook diagram:<br>
• <b>ALUSrc mux:</b> input <b>1</b> is on top, fed from <b>Read data 2</b>; input <b>0</b> is on the bottom, fed from <b>Imm Gen</b>.<br>
• <b>MemtoReg mux:</b> input <b>0</b> on top from Data memory <b>Read data</b>; input <b>1</b> on the bottom from the <b>ALU result</b>.</div>
<div class="tblwrap"><table class="tbl"><tr><th>Branch</th><th>ALUSrc</th><th>RegWrite</th><th>MemToReg</th></tr>
<tr><td class="m">&nbsp;</td><td class="m">&nbsp;</td><td class="m">&nbsp;</td><td class="m">&nbsp;</td></tr></table></div>`
 + DPFIG({mux:"rev", cap:"Look carefully at the two mux input labels - on THIS diagram they are the opposite way round from the textbook figure."}),
 sol:`<div class="tblwrap"><table class="tbl">
<tr><th>Branch</th><th>ALUSrc</th><th>RegWrite</th><th>MemToReg</th></tr>
<tr><td class="m"><b>0</b></td><td class="m"><b>1</b></td><td class="m"><b>1</b></td><td class="m"><b>1</b></td></tr>
</table></div>
<pre class="code">Branch   = 0   → an Add is not a branch.
ALUSrc   = 1   → the ALU's second operand must be Read data 2,
                 and in THIS figure Read data 2 is input <b>1</b>.
RegWrite = 1   → an Add writes its result into rd.
MemToReg = 1   → the written value is the ALU result,
                 and in THIS figure the ALU result is input <b>1</b>.</pre>
<div class="note"><b>Compare with the standard figure.</b> The very same instruction on the textbook datapath gives Branch 0, MemWrite 0, RegWrite 1, <strong>ALUSrc 0</strong> — and MemtoReg 0. The instruction has not changed; only the mux labelling has. <strong>Always read the 0 and 1 labels off the diagram in front of you before answering.</strong> This is the single most common way to lose these marks.</div>`},

{src:"Sheet 4 · Q17", fmt:"Datapath", mins:10,
 t:"Trace the wire values in hex",
 q:`<p>Study the RISC-V datapath thoroughly. Assume that initially <code>PC = 600h</code>, <code>x1 = 222h</code>, <code>x2 = 444h</code>, <code>x3 = 666h</code>, <code>x4 = 999h</code>.</p>
<p><strong>Determine</strong> the values of A, B, C, D, E in hex for the instructions executed <strong>sequentially</strong>. If the value does not matter, write it as <strong>X</strong> (don't care).</p>
<div class="given"><b>The labels on the diagram:</b> A = Read data 1 going into the ALU · B = the mux output going into the ALU's second input · C = the ALU result · D = the value heading back to the register file's Write data · E = the new PC value.</div>
<pre class="code">i.  sub x1, x2, x1
ii. sd  x4, 12(x2)</pre>`
 + DPFIG({mux:"rev",
   marks:[{t:"A",x:348,y:156},{t:"B",x:352,y:196},{t:"C",x:455,y:178},{t:"D",x:300,y:372},{t:"E",x:49,y:173}],
   cap:"A = Read data 1 into the ALU . B = the mux output into the ALU second input . C = the ALU result . D = the value written back to the register file . E = the new PC."}),
 sol:`<div class="tblwrap"><table class="tbl">
<tr><th></th><th>Instruction</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
<tr><td class="m">i.</td><td class="m">sub x1, x2, x1</td><td class="m"><b>444h</b></td><td class="m"><b>222h</b></td><td class="m"><b>222h</b></td><td class="m"><b>222h</b></td><td class="m"><b>604h</b></td></tr>
<tr><td class="m">ii.</td><td class="m">sd x4, 12(x2)</td><td class="m"><b>444h</b></td><td class="m"><b>Ch</b></td><td class="m"><b>450h</b></td><td class="m"><b>X</b></td><td class="m"><b>608h</b></td></tr>
</table></div>
<p><strong>i. sub x1, x2, x1</strong></p>
<pre class="code">A = Read data 1 = x2 = <b>444h</b>
B = Read data 2 = x1 = <b>222h</b>        (ALUSrc picks the register)
C = ALU result  = 444h − 222h = <b>222h</b>
D = value written back = <b>222h</b>       (an R-type writes the ALU result)
E = PC + 4 = 600h + 4 = <b>604h</b></pre>
<p><strong>ii. sd x4, 12(x2)</strong></p>
<pre class="code">A = Read data 1 = x2 = <b>444h</b>        (the base register)
B = the immediate 12 = <b>Ch</b>          (ALUSrc picks the immediate)
C = ALU result = 444h + Ch = <b>450h</b>   (the memory address)
D = <b>X</b>  — a store writes nothing back to the register file
E = PC + 4 = 604h + 4 = <b>608h</b></pre>
<div class="kid"><b>Two traps here.</b> The PC has already moved on by the second instruction, so E counts 604h → 608h, not 600h again. And 12 in decimal is <b>Ch</b> in hex — the question wants every answer in hex.</div>`},

{src:"Sheet 4 · Q20", fmt:"Math", mins:8,
 t:"Fetch an instruction from big-endian memory",
 q:`<p>Assume the memory is following the <strong>Big Endian</strong> approach.</p>
<pre class="code">PC = 0x0040ABCD123045B1</pre>
<div class="tblwrap"><table class="tbl">
<tr><th>Instruction Memory address</th><th>Content</th></tr>
<tr><td class="m">0x40ABCD123045AD</td><td class="m">0111 0101</td></tr>
<tr><td class="m">…AE</td><td class="m">1011 1110</td></tr>
<tr><td class="m">…AF</td><td class="m">1001 0001</td></tr>
<tr><td class="m">…B0</td><td class="m">1100 0000</td></tr>
<tr><td class="m">…B1</td><td class="m">0000 0001</td></tr>
<tr><td class="m">…B2</td><td class="m">1001 0101</td></tr>
<tr><td class="m">…B3</td><td class="m">0000 0101</td></tr>
<tr><td class="m">…B4</td><td class="m">0011 0011</td></tr>
</table></div>
<p><strong>Fetch</strong> the instruction from memory. <strong>Convert</strong> your answer to Hex.</p>`,
 sol:`<p>Two facts drive the whole answer, and the sheet writes them out:</p>
<ul>
<li><strong>Instructions are stored in instruction memory sequentially.</strong></li>
<li><strong>Instruction size = 32 bits</strong> — so 4 consecutive bytes.</li>
</ul>
<pre class="code">The PC ends in ...45B1, so start at address ...B1
and take the next four bytes: B1, B2, B3, B4.

  B1 → 0000 0001
  B2 → 1001 0101
  B3 → 0000 0101
  B4 → 0011 0011</pre>
<pre class="code">Big endian: the first byte read is the MOST significant byte,
so the bytes go straight into the answer in the order read.

  0000  0001  1001  0101
    0     1     9     5

  0000  0101  0011  0011
    0     5     3     3

⇒ <b>(01950533)ₕ</b></pre>
<div class="note"><b>Why big endian matters.</b> In big endian the byte at the lowest address is the top of the number, so you assemble the bytes in the order you read them. In little endian you would have to reverse them, giving 0x33050195 instead.</div>`},

{src:"Sheet 4 · Q22", fmt:"Math", mins:5,
 t:"Clock period of a single-cycle datapath",
 q:`<div class="tblwrap"><table class="tbl">
<tr><th>Instruction</th><th>Time (ps)</th></tr>
<tr><td class="m">Add X21, X22, X23</td><td class="m">10</td></tr>
<tr><td class="m">Sub X21, X23, X24</td><td class="m">20</td></tr>
<tr><td class="m">Mul X22, X23, X26</td><td class="m">15</td></tr>
<tr><td class="m">LD X22, 0(X21)</td><td class="m">25</td></tr>
</table></div>
<p>The above instructions are being run in a <strong>single cycle datapath</strong>.</p>
<p>a. Determine the <strong>clock period</strong> of this system.<br>
b. What would be the <strong>total time</strong> to run this instruction sequence?</p>`,
 sol:`<p><strong>a) Clock period</strong></p>
<pre class="code">"Longest delay determines the clock period."
The longest instruction is LD at 25 ps.

∴ Clock period = <b>25 ps</b></pre>
<p><strong>b) Total time</strong></p>
<pre class="code">In a single-cycle datapath EVERY instruction takes one full
clock cycle, no matter how short it really is.

  1 instruction  = 25 ps
∴ 4 instructions = 25 × 4 = <b>100 ps</b></pre>
<div class="kid"><b>This is the whole argument against single-cycle.</b> The Add really only needed 10 ps but is charged 25 ps, because the clock has to be slow enough for the slowest instruction. That wasted time is what pipelining recovers.</div>`}
],

CH5:[
{src:"Sheet 5 · Q1", fmt:"Math", mins:4,
 t:"Cache index from a block address",
 q:`<p>Given cache size = <strong>4 blocks</strong>, Block Address = <strong>129</strong>.</p>
<p>Find the cache index where this block will be mapped.</p>`,
 sol:`<pre class="code">Cache index = 129 mod 4
            = 1000 0001 mod 2²
            = <b>01</b>   (Ans)</pre>
<div class="kid"><b>The shortcut:</b> 4 = 2², so "mod 4" is just "keep the last 2 bits". 129 in binary ends in <b>01</b>. No division needed.</div>`},

{src:"Sheet 5 · Q2", fmt:"Math", mins:4,
 t:"Block address from a memory address",
 q:`<p>Find the <strong>cache block address</strong> for the memory address = <strong>321</strong>, if the block size is <strong>10 bytes</strong>.</p>`,
 sol:`<pre class="code">Block address = ⌊ 321 / 10 ⌋
              = ⌊ 32.1 ⌋
              = 32
              = <b>10 0000</b>   (Ans)</pre>
<div class="note"><b>Always take the floor.</b> 32.1 becomes 32, never 33. The fractional part is telling you <em>which byte inside the block</em> you landed on — that is the offset's job, not the block address's.</div>`},

{src:"Sheet 5 · Q3", fmt:"Math", mins:6,
 t:"Cache index when sizes are given in bits",
 q:`<p>Find the <strong>cache index</strong> for the memory address = <strong>239</strong>, given that the <strong>block size is 32 bits</strong> and the <strong>cache size is 64 bits</strong>.</p>`,
 sol:`<pre class="code">Block size  = 32 bits = <b>4 bytes</b>
Cache size  = 64 bits = 8 bytes

Number of blocks = 8 / 4 = <b>2 blocks</b>

Block address = ⌊ 239 / 4 ⌋
              = ⌊ 59.75 ⌋
              = 59

Index = 59 mod 2
      = <b>1</b>   (Ans)</pre>
<div class="note"><b>Two conversions before any real work.</b> Sizes given in <em>bits</em> must become <em>bytes</em>, then cache ÷ block gives the number of blocks. Skipping that turns every later number into nonsense.</div>`},

{src:"Sheet 5 · Q4", fmt:"Math", mins:7,
 t:"Split an address into tag, index and offset",
 q:`<p>Find the <strong>cache index, Tag, and offset bits</strong> for the memory address = <strong>297</strong>, given that the <strong>Block size is 8 bits</strong> and the <strong>cache size is 32 bits</strong>.</p>`,
 sol:`<pre class="code">Block size = 8 bits  = <b>1 byte</b>
Cache size = 32 bits = 4 bytes
Number of blocks = 4 / 1 = <b>4 blocks</b>

Index bit size  = log₂(4) = <b>2 bits</b>
Offset bit size = log₂(1) = <b>0 bits</b>
Address 297 = <b>1 0010 1001</b>  → 9 bits
Tag bit size = 9 − 2 − 0 = <b>7 bits</b></pre>
<div class="row"><span class="row-name">Address 297 = 100101001</span>
<span class="bits" style="grid-template-columns:7fr 2fr">
<span>1001010<i>Tag — 7 bits</i></span><span>01<i>Index — 2 bits</i></span></span></div>
<pre class="code">Index bits = <b>01</b>
Tag bits   = <b>1001010</b>
<b>No offset bits</b>   (Ans)</pre>
<div class="note"><b>This exact question shape is on the mock final</b> (there with address 328). A 1-byte block legitimately gives <strong>zero</strong> offset bits — write "no offset bits", it is the correct answer, not a mistake.</div>`},

{src:"Sheet 5 · Q5", fmt:"Math + AMAT", mins:14,
 t:"Run the cache table, then AMAT",
 q:`<p><strong>Cache table:</strong></p>
<div class="tblwrap"><table class="tbl">
<tr><th>Index</th><th>Valid bit</th><th>Tag</th><th>Data (8 bits)</th></tr>
<tr><td class="m">000</td><td class="m">1</td><td class="m">100</td><td class="m">Data</td></tr>
<tr><td class="m">001</td><td class="m">0</td><td class="m"></td><td class="m"></td></tr>
<tr><td class="m">010</td><td class="m">1</td><td class="m">011</td><td class="m">Data</td></tr>
<tr><td class="m">011</td><td class="m">1</td><td class="m">001</td><td class="m">Data</td></tr>
<tr><td class="m">100</td><td class="m">0</td><td class="m"></td><td class="m"></td></tr>
<tr><td class="m">101</td><td class="m">1</td><td class="m">000</td><td class="m">Data</td></tr>
<tr><td class="m">110</td><td class="m">1</td><td class="m">010</td><td class="m">Data</td></tr>
<tr><td class="m">111</td><td class="m">0</td><td class="m"></td><td class="m"></td></tr>
</table></div>
<p><strong>Memory accesses:</strong> 1. 100100 &nbsp; 2. 111010 &nbsp; 3. 010110 &nbsp; 4. 100100 &nbsp; 5. 111110</p>
<p>a) For the following memory accesses, determine if it will be a hit or miss.<br>
b) Calculate the hit and miss ratio.<br>
c) Find the AMAT if the hit time is <strong>2 s</strong> and the miss penalty is <strong>5 s</strong>.<br>
d) If the CPU has a <strong>2 s clock</strong>, then determine how many cycles are required per instruction.</p>`,
 sol:`<p>First the field widths, from the table itself:</p>
<pre class="code">The cache has 8 blocks → index size = log₂(8) = <b>3 bits</b>
Block size = 8 bits = 1 byte → offset = log₂(1) = <b>0 bits</b>
Address is 6 bits → tag = 6 − 3 − 0 = <b>3 bits</b></pre>
<p><strong>a) Hit or miss</strong></p>
<div class="tblwrap"><table class="tbl">
<tr><th>#</th><th>Mem. Addr.</th><th>Tag</th><th>Index</th><th>Hit / miss</th><th>Why</th></tr>
<tr><td class="m">1</td><td class="m">100 100</td><td class="m">100</td><td class="m">100</td><td class="m"><b>miss</b></td><td>valid bit at 100 is 0</td></tr>
<tr><td class="m">2</td><td class="m">111 010</td><td class="m">111</td><td class="m">010</td><td class="m"><b>miss</b></td><td>valid, but tag 011 ≠ 111</td></tr>
<tr><td class="m">3</td><td class="m">010 110</td><td class="m">010</td><td class="m">110</td><td class="m"><b>hit</b></td><td>valid and tag 010 matches</td></tr>
<tr><td class="m">4</td><td class="m">100 100</td><td class="m">100</td><td class="m">100</td><td class="m"><b>hit</b></td><td>access 1 loaded it</td></tr>
<tr><td class="m">5</td><td class="m">111 110</td><td class="m">111</td><td class="m">110</td><td class="m"><b>miss</b></td><td>row 110 now holds tag 010</td></tr>
</table></div>
<p><strong>b) Ratios</strong></p>
<pre class="code">Hit Ratio  = <b>2/5</b>
Miss Ratio = <b>3/5</b></pre>
<p><strong>c) AMAT</strong></p>
<pre class="code">AMAT = Hit time + Miss Rate × Miss Penalty
     = 2 + (3/5) × 5
     = 2 + 3
     = <b>5 s</b></pre>
<p><strong>d) Cycles per instruction</strong></p>
<pre class="code">2 s → 1 cycle
1 s → ½ cycle
5 s → 5/2 = <b>2.5 cycles</b>

So, 2.5 cycles are required per instruction.</pre>
<div class="note"><b>Track the table as you go.</b> After access 1 row 100 becomes valid with tag 100 — which is exactly why access 4 hits. After access 2 row 010's tag is replaced by 111, and after access 5 row 110's tag becomes 111. Redraw the table after every miss; examiners give marks for it.</div>`}
]
};

CH2:{name:"Concepts & T/F", mins:"20 / 30 min", lesson:`
<h2>Chapter 2 — every concept question, answered</h2>
<p>Read these after the units. The exam asks them as "explain", "justify" or true/false. Each model answer is one or two sentences — that is all a 1–2 mark question wants.</p>

<h3>The design principles</h3>
<div class="cq"><span class="cqq">Why does every arithmetic instruction have exactly three operands?</span><span class="cqa"><strong>Design Principle 1 — simplicity favours regularity.</strong> One fixed shape means the hardware decoding it stays simple and fast. Allowing a variable number of operands would complicate every instruction for the benefit of a few.</span></div>
<div class="cq"><span class="cqq">Why does RISC-V have only 32 registers?</span><span class="cqa"><strong>Design Principle 2 — smaller is faster.</strong> A larger register file takes longer to access. 32 also happens to fit neatly in a 5-bit field, which keeps instructions compact.</span></div>
<div class="cq"><span class="cqq">Why are there six instruction formats instead of one?</span><span class="cqa"><strong>Design Principle 3 — good design demands good compromises.</strong> We want every instruction to be the same 32-bit length AND a single layout, but both are impossible together. RISC-V keeps the fixed length and accepts several layouts.</span></div>

<h3>Addressing</h3>
<div class="cq"><span class="cqq">What role does the offset play in base displacement addressing, and what is the benefit of this system? <em>(mock final, Q2d)</em></span><span class="cqa">The instruction gives a <strong>base register</strong> plus a constant <strong>offset</strong>, and the hardware computes <code>address = base + offset</code>. The offset is the distance from the base to the item you actually want.<br><strong>Benefits:</strong> one base register can reach a whole array or structure, so you do not need a separate register per element; the offset is a small constant inside the instruction, so no extra load is needed to fetch the address; and stepping through an array only changes the offset, not the base.</span></div>
<div class="cq"><span class="cqq">Why must array data be loaded into a register before you can add it?</span><span class="cqa">Arithmetic instructions in RISC-V operate <strong>only on registers</strong>. Memory can only be reached by load and store. This is what makes it a load/store architecture, and it is why <code>ld</code> always appears before the <code>add</code>.</span></div>
<div class="cq"><span class="cqq">Why is the S-type immediate split into two pieces?</span><span class="cqa">So that <strong>rs1 and rs2 always sit in the same bit positions</strong> in every format. The hardware can then start reading the register file before it has finished decoding the instruction. The immediate is the field that gives way; the same reasoning produces the odd SB-type layout.</span></div>
<div class="cq"><span class="cqq">Why does a branch use PC-relative addressing?</span><span class="cqa">Most branch targets are close to the branch itself, so storing a small <em>relative</em> offset needs far fewer bits than a full 64-bit address. Target = <code>PC + immediate × 2</code>.</span></div>

<h3>Numbers and instructions</h3>
<div class="cq"><span class="cqq">What is the stored-program concept and why does it matter?</span><span class="cqa">Instructions are stored in memory as binary numbers, <strong>exactly like data</strong>. That is why programs can operate on other programs — compilers, assemblers and linkers exist because of it — and why a binary runs unchanged on any machine with the same instruction set.</span></div>
<div class="cq"><span class="cqq">Why is a register field 5 bits wide?</span><span class="cqa">There are 32 registers and 2⁵ = 32, so 5 bits addresses every one of them exactly.</span></div>
<div class="cq"><span class="cqq">What is sign extension and when is it used?</span><span class="cqa">Widening a number while keeping its value, by <strong>copying the sign bit to the left</strong>. Used whenever a 12-bit immediate or a narrow load must become a full 64-bit value. Unsigned versions (<code>lbu</code>, <code>lhu</code>, <code>lwu</code>) fill with zeros instead.</span></div>
<div class="cq"><span class="cqq">Why is there no <code>subi</code> instruction?</span><span class="cqa">It would be redundant. <code>addi</code> with a negative immediate does exactly the same job, so leaving <code>subi</code> out keeps the instruction set smaller with no loss of power.</span></div>
<div class="cq"><span class="cqq">Why do we need <code>lui</code>?</span><span class="cqa">An immediate field is only 12 bits (−2048 to 2047). <code>lui</code> loads a 20-bit constant into bits [31:12], and a following <code>addi</code> fills the low 12 bits, so together they build a large constant that cannot fit in one instruction.</span></div>
<div class="cq"><span class="cqq">What is a basic block?</span><span class="cqa">A sequence of instructions with <strong>no branches inside it</strong> (except possibly at the end) and <strong>no branch targets inside it</strong> (except possibly at the beginning). Compilers identify basic blocks so they can optimise within them safely.</span></div>
<div class="cq"><span class="cqq">Which registers must a called function preserve?</span><span class="cqa">The <strong>saved registers</strong> x8–x9 and x18–x27 — the callee must save and restore them if it uses them. The <strong>temporaries</strong> x5–x7 and x28–x31 are not preserved, so if the caller still needs them it must save them itself.</span></div>

<h3>True or false</h3>
<ul class="tfl">
<li><span class="tt ff">FALSE</span><span>Arithmetic instructions can operate directly on memory operands. <em>(Registers only — load first.)</em></span></li>
<li><span class="tt ff">FALSE</span><span>Writing to x0 changes its value. <em>(x0 is hardwired to 0; writes are discarded.)</em></span></li>
<li><span class="tt">TRUE</span><span>Every RISC-V instruction in the base set is exactly 32 bits long.</span></li>
<li><span class="tt">TRUE</span><span>A store instruction leaves both of its registers unchanged.</span></li>
<li><span class="tt ff">FALSE</span><span>The index of an array is used directly as the offset. <em>(It must be multiplied by the element size first.)</em></span></li>
<li><span class="tt">TRUE</span><span><code>slli</code> by k multiplies by 2ᵏ and <code>srli</code> by k divides by 2ᵏ.</span></li>
<li><span class="tt ff">FALSE</span><span><code>beq x0, x0, L</code> is a conditional branch. <em>(x0 always equals x0, so it is effectively unconditional.)</em></span></li>
<li><span class="tt">TRUE</span><span>A non-negative number has the same bit pattern in unsigned and 2's complement form.</span></li>
<li><span class="tt ff">FALSE</span><span><code>jal</code> and <code>beq</code> can reach equally far. <em>(jal's UJ format has a 20-bit immediate; beq's SB format has 12.)</em></span></li>
<li><span class="tt">TRUE</span><span>The stack grows downward, so making room uses a negative <code>addi</code> on x2.</span></li>
</ul>`},

CH3:{name:"Concepts & T/F", mins:"20 / 30 min", lesson:`
<h2>Chapter 3 — every concept question, answered</h2>

<h3>Representation</h3>
<div class="cq"><span class="cqq">When is a number normalized?</span><span class="cqa">When there is <strong>exactly one digit before the point and that digit is not zero</strong>. In binary that always means the form <code>1.xxxx × 2ⁿ</code>.</span></div>
<div class="cq"><span class="cqq">What is the hidden bit and why does it exist?</span><span class="cqa">Every normalized binary number begins with "1.", so storing that 1 would waste a bit — it is implied instead. The stored fraction plus the implied 1 gives the significand, which always satisfies <strong>1.0 ≤ |significand| &lt; 2.0</strong>. The saving buys one extra bit of precision for free.</span></div>
<div class="cq"><span class="cqq">Why is the exponent stored with a bias instead of in 2's complement?</span><span class="cqa">The exponent field is treated as an <strong>unsigned</strong> number so that floating point values can be compared using ordinary integer comparison hardware. Adding the bias shifts every possible exponent, including negative ones, into a positive range.</span></div>
<div class="cq"><span class="cqq">Why is the usable biased-exponent range 1 to 2ⁿ−2 rather than 0 to 2ⁿ−1?</span><span class="cqa">The all-zeros and all-ones patterns are <strong>reserved</strong> for special values, so they cannot encode ordinary numbers.</span></div>
<div class="cq"><span class="cqq">What do the reserved exponent patterns mean?</span><span class="cqa">Exponent all 1s with a <strong>zero fraction</strong> = <strong>± Infinity</strong>. Exponent all 1s with a <strong>non-zero fraction</strong> = <strong>NaN</strong> (Not a Number), produced by undefined results such as 0.0 / 0.0.</span></div>

<h3>Range and precision — the trade-off the mock asks about</h3>
<div class="cq"><span class="cqq">Given two formats of the same total width — one with a 13-bit fraction, one with a 17-bit fraction — which gives the more accurate conversion, and why? <em>(mock final, Q1a-iii)</em></span><span class="cqa">The one with the <strong>larger fraction field (17 bits)</strong>. Precision is decided entirely by the number of fraction bits: more fraction bits means more significant digits are kept, so less of the original value is truncated away.<br>The cost is that, in a fixed total width, those extra fraction bits come out of the <strong>exponent</strong> field — so the format gains precision but loses <strong>range</strong>. Choose the big fraction when accuracy matters and the values are modest; choose the big exponent when the values are extremely large or small.</span></div>
<div class="cq"><span class="cqq">How do you find the actual exponent range of a format? <em>(mock final, Q1c)</em></span><span class="cqa">Work from the exponent field width n:<br><code>Bias = 2ⁿ⁻¹ − 1</code><br><code>Usable biased range = 1 to 2ⁿ − 2</code><br><code>Actual range = (1 − Bias) to (2ⁿ − 2 − Bias)</code><br><strong>Worked example — 20-bit register, 1 sign, 6 exponent, 13 fraction:</strong> Bias = 2⁵ − 1 = 31. Usable biased range = 1 to 62. Actual exponent range = (1 − 31) to (62 − 31) = <strong>−30 to +31</strong>.</span></div>
<div class="cq"><span class="cqq">How many decimal digits of precision do single and double give?</span><span class="cqa">Single ≈ 2⁻²³, so 23 × log₁₀2 ≈ <strong>6 decimal digits</strong>. Double ≈ 2⁻⁵², so 52 × 0.3 ≈ <strong>16 decimal digits</strong>.</span></div>

<h3>Arithmetic</h3>
<div class="cq"><span class="cqq">Why must you align the points before adding two floating point numbers, but not before multiplying?</span><span class="cqa">Addition only makes sense between quantities scaled the same way, so the smaller exponent must be raised until both match. Multiplication has no such requirement — you simply <strong>add the exponents</strong> and multiply the significands.</span></div>
<div class="cq"><span class="cqq">When multiplying, why do you subtract one bias from the sum of the exponents?</span><span class="cqa">Each stored exponent already includes the bias, so adding them counts it <strong>twice</strong>. Subtracting one bias restores the correct biased result. With actual (unbiased) exponents you simply add.</span></div>
<div class="cq"><span class="cqq">Why might you have to normalize <em>again</em> after an operation?</span><span class="cqa">Adding or multiplying two significands can produce a value of 2.0 or more (for example 1.1 + 1.1 = 11.0₂), which breaks the "one non-zero digit before the point" rule. Shift right and increase the exponent — then round.</span></div>
<div class="cq"><span class="cqq">What is the difference between overflow and underflow?</span><span class="cqa"><strong>Overflow</strong>: the result is too <em>large</em> — its biased exponent is above the usable upper limit. <strong>Underflow</strong>: the result is too <em>small</em> to represent in this system — its biased exponent falls below 1. Always test the <strong>biased</strong> exponent, never the actual one.</span></div>
<div class="cq"><span class="cqq">When does integer addition overflow?</span><span class="cqa">Only when the two values actually added have the <strong>same sign</strong> and the answer comes out with the opposite sign. Adding a positive and a negative can never overflow. Every subtraction question reduces to this rule by rewriting <code>A − B</code> as <code>A + (−B)</code>.</span></div>

<h3>Multiplication hardware</h3>
<div class="cq"><span class="cqq">Why is the product register 128 bits for 64-bit operands?</span><span class="cqa">The product of two n-bit numbers can be up to <strong>2n bits</strong> long. Since RISC-V has no 128-bit register, two 64-bit registers are used side by side.</span></div>
<div class="cq"><span class="cqq">What does the optimized multiplier save?</span><span class="cqa">There is <strong>no separate multiplier register</strong> — the multiplier sits in the lower half of the product and is consumed as the product shifts right — and the <strong>ALU is only 64 bits</strong> instead of 128, because it only ever adds into the product's upper half.</span></div>

<h3>Instructions</h3>
<div class="cq"><span class="cqq">Why does RISC-V have a separate floating point register file (f0–f31)?</span><span class="cqa">Programs almost never mix integer and floating point data in the same operation, so keeping them apart doubles the number of available registers at almost no cost in code size, and keeps the FP hardware separate from the integer datapath.</span></div>
<div class="cq"><span class="cqq">Why does <code>feq.s</code> write its result to an integer register?</span><span class="cqa">There is no "branch if float less than" instruction. The comparison produces a 0 or 1 in an <strong>integer</strong> register, and you then branch on it with an ordinary <code>beq</code> or <code>bne</code>.</span></div>
<div class="cq"><span class="cqq">What is the difference between <code>fcvt</code> and <code>fmv</code>?</span><span class="cqa"><code>fcvt</code> <strong>converts</strong> the representation — integer 3 becomes floating point 3.0. <code>fmv</code> <strong>moves the raw bits</strong> unchanged between an integer and a floating point register.</span></div>

<h3>True or false</h3>
<ul class="tfl">
<li><span class="tt ff">FALSE</span><span><code>0.002 × 10⁻⁴</code> is normalized. <em>(The digit before the point is 0.)</em></span></li>
<li><span class="tt">TRUE</span><span>Shifting the binary point left k places means adding k to the exponent.</span></li>
<li><span class="tt ff">FALSE</span><span>The bias is always 127. <em>(It is 2ⁿ⁻¹ − 1, so it depends on the exponent field width.)</em></span></li>
<li><span class="tt">TRUE</span><span>The valid range of a biased exponent excludes both the all-0s and all-1s patterns.</span></li>
<li><span class="tt ff">FALSE</span><span>Adding a positive and a negative integer can overflow. <em>(Never — the result lies between them.)</em></span></li>
<li><span class="tt">TRUE</span><span>An offset field of 0 bits is legal when the block or element size is 1 byte.</span></li>
<li><span class="tt ff">FALSE</span><span>Double precision is more precise but covers a smaller range than single. <em>(It is better at both.)</em></span></li>
<li><span class="tt">TRUE</span><span>Widening the fraction field at a fixed total width improves precision but reduces range.</span></li>
<li><span class="tt ff">FALSE</span><span>Floating point arithmetic instructions can take operands from x registers. <em>(FP arithmetic uses f registers only.)</em></span></li>
</ul>`},

CH4:{name:"Concepts & T/F", mins:"25 / 35 min", lesson:`
<h2>Chapter 4 — every concept question, answered</h2>
<p>Chapter 4 is the most "explain it" chapter on the paper. Several of these are word-for-word the practice sheet's conceptual questions, which the solution sheet only answered with hints.</p>

<h3>The building blocks</h3>
<div class="cq"><span class="cqq">Explain how the register file performs read and write operations, and why the read/write register pins are 5 bits. <em>(sheet Q1)</em></span><span class="cqa"><strong>Reads</strong> are combinational and always happening: put a register number on <em>Read register 1</em> or <em>Read register 2</em> and the 64-bit contents appear on <em>Read data 1</em> / <em>Read data 2</em>, with no control signal needed.<br><strong>Writes</strong> are clocked and gated: the value on <em>Write data</em> is stored into the register named by <em>Write register</em> only on the clock edge and only when <strong>RegWrite = 1</strong>.<br>The register-number pins are <strong>5 bits because there are 32 registers</strong>, and 2⁵ = 32.</span></div>
<div class="cq"><span class="cqq">What is the significance of the Zero pin on the ALU, and how does the ALU know which operation to perform? <em>(sheet Q2)</em></span><span class="cqa"><strong>Zero</strong> is an <em>output</em> that goes high when the ALU result is 0. Branches use it: <code>beq</code> subtracts the two registers, and Zero = 1 means they were equal. It is ANDed with Branch to form PCSrc.<br>The operation is chosen by the <strong>4-bit ALU control input</strong>, which the ALU Control block produces from the 2-bit ALUOp (from the Control unit) plus the instruction's funct bits.</span></div>
<div class="cq"><span class="cqq">Does the ALU Control use Instruction bits 30 and 14–12 for the LD instruction? Justify. <em>(sheet Q3a)</em></span><span class="cqa"><strong>No.</strong> For <code>ld</code>, <code>sd</code> and <code>addi</code> the ALU must always perform <strong>add</strong> — to compute the effective address — regardless of anything else in the instruction. ALUOp = 00 tells the ALU Control to output "add" (0010) directly, so the funct bits are ignored.</span></div>
<div class="cq"><span class="cqq">In which cases does the ALU Control use bits 30 and 14–12, and why only those four bits? <em>(sheet Q3b)</em></span><span class="cqa">Only for <strong>R-type</strong> instructions (ALUOp = 10). All R-type instructions share one opcode, so the opcode alone cannot say whether it is add, sub, and or or — the distinguishing information lives in <strong>funct3 (bits 14–12)</strong> and <strong>funct7</strong>. Within the subset taught, funct7 differs in only one place, <strong>bit 30</strong>, so those four bits are enough to separate every operation.</span></div>
<div class="cq"><span class="cqq">Explain why the Immediate Generation Unit requires the entire instruction rather than just the 12 immediate bits. <em>(mock final, Q3a)</em></span><span class="cqa">Because the immediate is <strong>not in the same place in every format</strong>. I-type keeps it as one 12-bit field; S-type splits it into imm[11:5] and imm[4:0]; SB-type scatters it further and implies a shift; U-type uses a 20-bit field. The unit must see the <strong>whole instruction</strong> — including the opcode — to know which format it is and therefore which bits to collect and how to reassemble and sign-extend them into 64 bits.</span></div>
<div class="cq"><span class="cqq">Why can't you simply join two wires that feed the same input?</span><span class="cqa">Two sources driving one wire is an electrical conflict and the value would be undefined. A <strong>multiplexer</strong> selects one of them under control of a select signal. That is why the datapath has exactly three: PC source, ALU second operand, and register write-back source.</span></div>
<div class="cq"><span class="cqq">Why does the datapath need separate instruction and data memories?</span><span class="cqa">Each datapath element can perform <strong>only one function per clock cycle</strong>. A load must fetch its instruction and read its data in the same cycle, which a single memory could not do. In the pipeline the same issue reappears as a <strong>structural hazard</strong>.</span></div>

<h3>Single-cycle and timing</h3>
<div class="cq"><span class="cqq">What does "single-cycle" mean? <em>(sheet Q23)</em></span><span class="cqa"><strong>One instruction completes in exactly one clock cycle.</strong> Every instruction — long or short — is given the same full cycle, and that cycle must be long enough for the slowest one.</span></div>
<div class="cq"><span class="cqq">What is the critical path, and why does it matter?</span><span class="cqa">The longest route through the datapath, which belongs to the <strong>load</strong> instruction: Instruction memory → register file → ALU → data memory → register file. It sets the clock period for every instruction, which is why single-cycle design "violates making the common case fast".</span></div>
<div class="cq"><span class="cqq">Compare a single-cycle datapath with a pipelined one, and say why pipelining is used in real life. <em>(sheet Q25)</em></span><span class="cqa"><strong>Single-cycle:</strong> one instruction per cycle; the clock period is set by the <em>slowest instruction</em>; hardware sits idle for short instructions; simple to design; no hazards.<br><strong>Pipelined:</strong> five instructions in flight at once; the clock period is set by the <em>slowest stage</em>, so it is much shorter; throughput rises towards one instruction per cycle; needs pipeline registers and hazard handling.<br><strong>Why real machines pipeline:</strong> far higher instruction throughput for a modest amount of extra hardware. The individual instruction is no faster, but many more finish per second.</span></div>
<div class="cq"><span class="cqq">Can the 5 stages be split into even more stages to go faster? <em>(sheet Q26)</em></span><span class="cqa">Up to a point, yes — more stages means a shorter stage, so a faster clock and more instructions in flight. But the gains stop because: each stage still pays the pipeline-register delay, so overhead grows; the stages become harder to balance; and hazard and branch penalties cost more cycles. Beyond roughly a dozen stages the extra penalties outweigh the faster clock.</span></div>

<h3>Hazards</h3>
<div class="cq"><span class="cqq">Explain why data hazards occur in a pipelined datapath. <em>(sheet Q27)</em></span><span class="cqa">Because instructions overlap. An instruction reads its registers in <strong>ID</strong>, but the instruction ahead of it does not write its result until <strong>WB</strong> — three stages later. If the second instruction needs a register the first has not written yet, it reads a stale value. The dependency is real; the pipeline simply has not caught up.</span></div>
<div class="cq"><span class="cqq">What is a structural hazard? Give an example. <em>(sheet Q29)</em></span><span class="cqa">Two instructions need the <strong>same hardware resource in the same cycle</strong>, so one must wait.<br><strong>Example:</strong> with a single unified memory, a <code>ld</code> in its MEM stage is reading data at the same moment a later instruction wants to fetch its instruction in IF. One of them stalls and a bubble enters the pipeline. The fix is separate instruction and data memories or caches.</span></div>
<div class="cq"><span class="cqq">What is forwarding, and when is it not enough?</span><span class="cqa"><strong>Forwarding</strong> routes a result straight from where it is produced to where it is needed, instead of waiting for it to be written into a register. It removes the stall completely for arithmetic-to-arithmetic dependencies.<br>It is <strong>not enough for a load-use hazard</strong>: a load's value only exists at the end of MEM, but the next instruction needs it at the start of its EX — earlier in time. "You can't forward backward in time", so one bubble is unavoidable.</span></div>
<div class="cq"><span class="cqq">Why does "right-to-left flow lead to hazards"?</span><span class="cqa">The two wires that run backwards in the diagram are exactly the two problems: the <strong>WB → register file</strong> wire is where data hazards come from, and the <strong>branch result → PC</strong> wire is where control hazards come from. Information travelling against the flow means a later stage is feeding an earlier one.</span></div>

<h3>True or false</h3>
<ul class="tfl">
<li><span class="tt ff">FALSE</span><span>Zero is a control signal produced by the Control unit. <em>(It is an ALU output.)</em></span></li>
<li><span class="tt ff">FALSE</span><span>PCSrc comes directly out of the Control unit. <em>(It is Branch AND Zero, made by an AND gate.)</em></span></li>
<li><span class="tt">TRUE</span><span>MemtoReg is a don't-care whenever RegWrite is 0.</span></li>
<li><span class="tt ff">FALSE</span><span>A single instruction can have MemRead = 1 and MemWrite = 1 together.</span></li>
<li><span class="tt">TRUE</span><span>Shift-left-1 for the branch target costs no time — it only re-routes wires.</span></li>
<li><span class="tt ff">FALSE</span><span>Pipelining reduces the time taken by one individual instruction. <em>(It raises throughput; latency is unchanged.)</em></span></li>
<li><span class="tt">TRUE</span><span>The pipelined clock period is set by the slowest stage, not the slowest instruction.</span></li>
<li><span class="tt">TRUE</span><span>A load-use hazard costs one stall cycle even with full forwarding.</span></li>
<li><span class="tt ff">FALSE</span><span>The branch adder is skipped when a branch is not taken. <em>(The target is always computed; the mux just discards it.)</em></span></li>
<li><span class="tt">TRUE</span><span>Pipeline registers are what allow five instructions to be in flight at once.</span></li>
</ul>`},

CH5:{name:"Concepts & T/F", mins:"20 / 30 min", lesson:`
<h2>Chapter 5 — every concept question, answered</h2>
<p>The mock final's Chapter 5 section is <strong>four explain-questions and one calculation</strong>. This page is where most of those marks live.</p>

<h3>Why the hierarchy exists</h3>
<div class="cq"><span class="cqq">Explain why we need a memory hierarchy in our system. <em>(mock final, Q4b)</em></span><span class="cqa">Because fast memory is expensive and small, and cheap memory is large and slow — no single technology gives us both. SRAM is around 0.5–2.5 ns but costs $2000–5000 per GB; DRAM is 50–70 ns at $20–75; disk is milliseconds at cents.<br>Programs obey the <strong>principle of locality</strong>: at any moment they use only a small part of their code and data, and they reuse it (temporal) and use its neighbours (spatial). So we keep everything in the big cheap level and copy the small active piece upward into the fast level.<br><strong>The result:</strong> the average access time is close to the fastest level while the capacity and cost are close to the slowest. We get the illusion of memory that is simultaneously large, fast and cheap.</span></div>
<div class="cq"><span class="cqq">Explain the significance of the offset field in an address, with an example. <em>(mock final, Q4a)</em></span><span class="cqa">A cache block holds several bytes, but the CPU usually wants one specific byte inside it. The <strong>index</strong> picks the block and the <strong>tag</strong> confirms it is the right one — the <strong>offset selects the byte within that block</strong>.<br><strong>Example:</strong> with a 16-byte block, offset = log₂(16) = 4 bits. Address 1204 has block address ⌊1204/16⌋ = 75 and offset 1204 − (75 × 16) = 4, so the byte wanted is the 4th inside block 75.<br>If the block size is 1 byte there is nothing to choose inside it, so the offset is <strong>0 bits</strong> and the field disappears.</span></div>

<h3>Block size — the mock's justification question</h3>
<div class="cq"><span class="cqq">"Choosing a large size for the cache line helps minimize the cache miss penalty." Justify the validity of this statement. <em>(mock final, Q4d)</em></span><span class="cqa"><strong>The statement is false — it has it backwards.</strong> A larger cache line <em>increases</em> the miss penalty, because more bytes must be transferred from the lower level on every miss.<br>What a larger line can reduce is the <strong>miss rate</strong>, by exploiting spatial locality: fetching neighbours you are likely to want soon. Even that only holds up to a point — in a fixed-size cache, bigger lines mean <em>fewer</em> lines, so conflict misses rise, and unused bytes waste space (<strong>cache pollution</strong>). Beyond the sweet spot the miss rate climbs again.<br><strong>Correct version:</strong> a larger line may reduce the miss <em>rate</em> up to a point, but it always raises the miss <em>penalty</em>. To reduce the penalty you use early restart, critical-word-first, or an extra cache level.</span></div>

<h3>Writes — the mock's comparison question</h3>
<div class="cq"><span class="cqq">Write a comparison between write-through and write-back, with proper examples. <em>(mock final, Q4e)</em></span><span class="cqa"><strong>Write-through:</strong> on a write hit, update the cache <em>and</em> main memory together. Memory is always up to date and consistent, which makes recovery and multi-processor sharing simpler — but every write pays the cost of a slow memory access, so a write buffer is normally added so the CPU does not stall.<br><strong>Write-back:</strong> on a write hit, update <em>only</em> the cache and mark the block <strong>dirty</strong>. Memory is written only when that dirty block is evicted. Far fewer memory writes, so it is faster and uses less bandwidth — but memory holds stale data for a while, so a crash can lose it and other processors may see an old value.<br><strong>Example:</strong> a loop writing the same counter a thousand times causes a thousand memory writes under write-through, but under write-back it stays in the cache and reaches memory <em>once</em>, when the block is replaced.</span></div>
<div class="cq"><span class="cqq">What is the dirty bit for?</span><span class="cqa">It records whether a cache block has been written to since it was loaded. On replacement: dirty → write the block back to memory first; clean → simply overwrite it, since memory already matches. Without it, write-back would have to write every evicted block back.</span></div>
<div class="cq"><span class="cqq">Write allocate versus no-write allocate — what is the difference?</span><span class="cqa">These answer what happens on a write <strong>miss</strong>. <strong>Write allocate</strong> loads the block into the cache first and then writes into it — good when the block will be used again. <strong>No-write allocate</strong> writes straight to memory and never loads the block — good when you write once and move on, such as initialising an array. <strong>Write around</strong> = write-through + no-write allocate.</span></div>

<h3>The rest</h3>
<div class="cq"><span class="cqq">Distinguish temporal and spatial locality.</span><span class="cqa"><strong>Temporal:</strong> an item used recently will probably be used again soon — for example a loop counter, or the instructions of the loop itself. <strong>Spatial:</strong> items <em>near</em> a recently used item will probably be used soon — for example successive elements of an array, or sequential instructions. Caches exploit temporal locality by keeping blocks, and spatial locality by fetching a whole block at a time.</span></div>
<div class="cq"><span class="cqq">Define hit rate, miss rate, hit time and miss penalty.</span><span class="cqa"><strong>Hit rate</strong> = hits ÷ accesses. <strong>Miss rate</strong> = 1 − hit rate. <strong>Hit time</strong> = the time to access the upper level, <em>including</em> the time to decide whether it was a hit or a miss. <strong>Miss penalty</strong> = the time to replace the block from the lower level plus deliver it to the processor.</span></div>
<div class="cq"><span class="cqq">Why is AMAT hit time PLUS miss rate × penalty, rather than just the penalty?</span><span class="cqa">Because every access pays the hit time — you always have to look in the cache and find out whether the data is there. Only the fraction that miss pay the penalty on top.</span></div>
<div class="cq"><span class="cqq">What are the two ways a cache access can miss?</span><span class="cqa">Either the <strong>valid bit is 0</strong> (nothing has been loaded into that row yet), or the valid bit is 1 but the <strong>tag does not match</strong> (another block is occupying the row). Checking only the valid bit is the classic error.</span></div>
<div class="cq"><span class="cqq">Why are L1 and L2 designed differently?</span><span class="cqa"><strong>L1</strong> is tuned for a <strong>minimal hit time</strong>, so it is small and usually has a smaller block size. <strong>L2/L3</strong> are tuned for a <strong>low miss rate</strong> to avoid going to main memory, so they are larger and slower; their hit time matters less. Each level exists to reduce the miss <em>penalty</em> of the level above it.</span></div>
<div class="cq"><span class="cqq">Why does the miss penalty matter more as CPUs get faster?</span><span class="cqa">Memory speed has not kept up with processor speed. As the base CPI falls and the clock rate rises, the same fixed memory delay costs more CPU cycles, so memory stalls take a larger share of total execution time.</span></div>
<div class="cq"><span class="cqq">What happens on an instruction cache miss versus a data cache miss?</span><span class="cqa">Both stall the pipeline while the block is fetched. On an <strong>instruction</strong> cache miss the processor then <strong>restarts the instruction fetch</strong>; on a <strong>data</strong> cache miss it <strong>completes the data access</strong>.</span></div>

<h3>True or false</h3>
<ul class="tfl">
<li><span class="tt">TRUE</span><span>The valid bit is stored in the cache but is not part of the memory address.</span></li>
<li><span class="tt ff">FALSE</span><span>A matching tag alone is enough for a hit. <em>(The valid bit must also be 1.)</em></span></li>
<li><span class="tt">TRUE</span><span>In a direct mapped cache a memory block has exactly one possible location.</span></li>
<li><span class="tt ff">FALSE</span><span>A bigger block always lowers the miss rate. <em>(Only up to a point; then conflicts and pollution take over.)</em></span></li>
<li><span class="tt">TRUE</span><span>A larger block size increases the miss penalty.</span></li>
<li><span class="tt ff">FALSE</span><span>Write-back is safer than write-through. <em>(It is faster, but memory is stale so data can be lost.)</em></span></li>
<li><span class="tt">TRUE</span><span>Block address = ⌊memory address ÷ block size in bytes⌋, always rounded down.</span></li>
<li><span class="tt ff">FALSE</span><span>Offset bits are computed from the block size in bits. <em>(Convert to bytes first.)</em></span></li>
<li><span class="tt">TRUE</span><span>SRAM needs no refresh; DRAM does.</span></li>
<li><span class="tt ff">FALSE</span><span>The order of address fields can vary. <em>(It is always Tag, Index, Offset, left to right.)</em></span></li>
</ul>`}
};

<h3>Subtraction — the mock final's Q1b</h3>
<p>There is no separate procedure. <strong>A − B is A + (−B):</strong> flip the sign bit of the second number and run the addition steps.</p>

Step 4 — normalize again

/* Ch4 · unit 5 (Pipelining) — per-instruction time in a pipeline */
"2|4":`
<h3>How long does ONE instruction take in a pipeline?</h3>
<p>This trips people up, because there are two different numbers and the exam asks for both.</p>
<div class="syntax">Pipelined clock period  = the SLOWEST stage
Time for one instruction = number of stages × clock period
Total time for N instructions = (N + stages − 1) × clock period</div>
<pre class="code">Worked — stage times IF 10, ID 20, EX 20, MEM 20, WB 10 ps

Clock period = slowest stage = <b>20 ps</b>

Time for ONE instruction = 5 × 20 = <b>100 ps</b>
   (every stage is charged the full 20 ps, even IF which only needed 10)

4 instructions = (4 + 5 − 1) × 20 = 8 × 20 = <b>160 ps</b></pre>
<div class="note"><b>Notice what pipelining did and did not do.</b> One instruction now takes 100 ps, whereas adding the real stage times gives only 80 ps — so a single instruction got <em>slower</em>. But four instructions take 160 ps instead of 4 × 80 = 320 ps. Throughput doubled; latency did not improve. That is the sentence examiners want.</div>

<h3>The same question on a single-cycle machine</h3>
<pre class="code">Single-cycle clock period = the slowest INSTRUCTION
(add up that instruction's own stage times)

Example — IF 25, ID 10, RegRead 15, ALU 20, MemRead 20, RegWrite 25 ps
  R-type  = 25 + 10 + 15 + 20 + 25       = 95 ps
  LD      = 25 + 10 + 15 + 20 + 20 + 25  = 115 ps   ← longest

Clock period = <b>115 ps</b>
Clock cycles for N instructions = <b>N</b>   (one each)
Total time = N × 115 ps</pre>`,

/* Ch4 · unit 6 (Hazards) — the hazard counting + CPI drill the mock is built on */
"2|5":`
<h3>Counting hazards and CPI — the mock final's biggest question</h3>
<p>Mock Q3b gives a code sequence and asks six things about it. Here is the whole method, then a worked example.</p>

<h3>Step 1 — cycles and CPI on a SINGLE-CYCLE machine</h3>
<div class="syntax">Single-cycle: every instruction takes exactly 1 clock cycle.
Clock cycles = N          Average CPI = 1</div>
<p>And the follow-up they always ask: <strong>how many data hazards in a single-cycle datapath? Zero.</strong> Each instruction finishes completely before the next one starts, so there is never a stale register to read. Hazards are a <em>pipelining</em> problem only.</p>

<h3>Step 2 — find the dependencies</h3>
<p>Go through the code and mark, for each instruction, which register it <strong>writes</strong>. Then look ahead: does a later instruction <strong>read</strong> that same register while it is still in flight?</p>
<div class="syntax">A pipelined instruction WRITES its result in stage 5 (WB)
but the next instruction READS its registers in stage 2 (ID).

So a dependency is a hazard when the two instructions are close together.</div>
<div class="note"><b>State your assumption — the count depends on it.</b> Most textbooks (including ours) assume the register file <strong>writes in the first half of a cycle and reads in the second half</strong>. With that assumption a dependency at distance <strong>1 or 2</strong> is a hazard, and distance 3 is already safe. If your course assumes no such split, distance 3 is a hazard too. Write one line saying which you used and you cannot be marked wrong.</div>

<h3>Worked example</h3>
<pre class="code">1. Add X21, X22, X23      writes X21
2. Sub X21, X21, X24      reads X21  writes X21
3. Mul X22, X21, X26      reads X21  writes X22
4. LD  X22, 0(X21)        reads X21  writes X22</pre>
<p>Now list every producer → consumer pair and its distance:</p>
<div class="tblwrap"><table class="tbl">
<tr><th>Producer</th><th>Register</th><th>Consumer</th><th>Distance</th><th>Hazard?</th></tr>
<tr><td class="m">1. Add</td><td class="m">X21</td><td class="m">2. Sub</td><td class="m">1</td><td class="m"><b>yes</b></td></tr>
<tr><td class="m">1. Add</td><td class="m">X21</td><td class="m">3. Mul</td><td class="m">2</td><td class="m"><b>yes</b></td></tr>
<tr><td class="m">1. Add</td><td class="m">X21</td><td class="m">4. LD</td><td class="m">3</td><td class="m">no (safe)</td></tr>
<tr><td class="m">2. Sub</td><td class="m">X21</td><td class="m">3. Mul</td><td class="m">1</td><td class="m"><b>yes</b></td></tr>
<tr><td class="m">2. Sub</td><td class="m">X21</td><td class="m">4. LD</td><td class="m">2</td><td class="m"><b>yes</b></td></tr>
<tr><td class="m">3. Mul</td><td class="m">X22</td><td class="m">—</td><td class="m">—</td><td class="m">no — nothing reads X22</td></tr>
</table></div>
<p><strong>4 data hazards.</strong> Note instruction 4 <em>writes</em> X22 but never reads it, so that is not a dependency at all — only reads matter.</p>

<h3>Step 3 — fix them with STALLS only</h3>
<p>Insert bubbles until the consumer's ID comes after the producer's WB.</p>
<div class="tblwrap"><table class="tbl">
<tr><th>Distance</th><th>Bubbles needed</th></tr>
<tr><td class="m">1</td><td class="m">2</td></tr>
<tr><td class="m">2</td><td class="m">1</td></tr>
<tr><td class="m">3+</td><td class="m">0</td></tr>
</table></div>
<p>Only the <strong>worst</strong> dependency into each instruction counts — one stall fixes every dependency that instruction has. Here: instruction 2 needs 2 bubbles, instruction 3 needs 2 bubbles, instruction 4 needs 0 (after the earlier stalls have pushed it back). <strong>Total ≈ 4 stall cycles.</strong></p>

<h3>Step 4 — fix them with FORWARDING only</h3>
<p>Forwarding sends a result straight from EX (or MEM) into the next EX, so <strong>arithmetic-to-arithmetic dependencies cost nothing</strong>.</p>
<div class="syntax">With full forwarding, the ONLY stall left is the load-use hazard:
a load followed within one instruction by a use of the loaded register
 → exactly 1 bubble, every time.</div>
<p>In the example above none of the producers is a load, so forwarding removes <strong>all 4 hazards with 0 stalls</strong>.</p>

<h3>Step 5 — cycles and CPI</h3>
<div class="syntax">Pipelined cycles = N + (stages − 1) + stalls
                 = N + 4 + stalls          (5-stage pipeline)

Average CPI = total cycles ÷ N</div>
<pre class="code">Our 4 instructions, 5-stage pipeline:

no hazards at all:   4 + 4 + 0 = <b>8 cycles</b>,  CPI = 8/4  = <b>2.0</b>
with forwarding:     4 + 4 + 0 = <b>8 cycles</b>,  CPI = <b>2.0</b>
with stalls only:    4 + 4 + 4 = <b>12 cycles</b>, CPI = 12/4 = <b>3.0</b></pre>
<div class="kid"><b>Why is CPI 2 and not 1?</b> Because 4 instructions is tiny — the 4 extra fill cycles are a huge share of the total. With 1000 instructions it would be (1000+4)/1000 ≈ 1.004, essentially 1. Say that in your answer and you show you understand the fill cost.</div>

<h3>The checklist for this question type</h3>
<ol class="steps">
<li>Count the instructions → N.</li>
<li>Single-cycle: cycles = N, CPI = 1, data hazards = 0.</li>
<li>List every register each instruction writes, then find later instructions that read it within 2 (state your assumption).</li>
<li>Stalls-only: 2 bubbles for distance 1, 1 for distance 2.</li>
<li>Forwarding: only load-use costs a bubble — 1 each.</li>
<li>Cycles = N + 4 + stalls. CPI = cycles ÷ N.</li>
</ol>`

  const card=document.createElement('div'); card.className='card lesson';
  card.innerHTML='<div class="qmeta"><span>'+(last?'Concept bank':'Unit '+(ui+1)+' of '+(U.length-1))+' · <em>'+u.name+'</em></span><span class="fmt">'+u.mins+'</span></div>'+u.lesson;
  const nav=document.createElement('div'); nav.className='nav';
  const left=document.createElement('div'); left.style.display='flex'; left.style.gap='8px'; left.style.flexWrap='wrap';
  if(ui>0){ const p=document.createElement('button'); p.className='btn ghost'; p.textContent='← Back';
    p.onclick=()=>{ ui--; go(); }; left.appendChild(p); }
  const right=document.createElement('div'); right.style.display='flex'; right.style.gap='8px'; right.style.flexWrap='wrap';
  if(!last){
    const n=document.createElement('button'); n.className='btn';
    n.textContent = ui===U.length-2 ? '★ Concepts & T/F →' : 'Unit '+(ui+2)+' →';
    n.onclick=()=>{ ui++; go(); }; right.appendChild(n);
  } else {
    const n=document.createElement('button'); n.className='btn';
    n.textContent='Go to the '+CHAPTERS[ci].problems.length+' problems →';
    n.onclick=()=>{ mode='quiz'; pi=-1; go(); }; right.appendChild(n);
  }
  nav.append(left,right); card.appendChild(nav);
  stage.innerHTML=''; stage.appendChild(card);
  if(document.getElementById('dpsvg')) dpInit();
  if(document.getElementById('sim')){ simReset(); simDraw(); }
  if(document.getElementById('pipedemo')) pipeDraw();
  save();
}

/* ---------- PROBLEM LIST ---------- */
function renderProblemList(){
  const c=CHAPTERS[ci];
  let tot=0; c.problems.forEach(p=>tot+=p.mins);
  let list='';
  c.problems.forEach((p,i)=>{
    const st=mark[ci][i];
    list+='<button class="pitem '+(st==='ok'?'done':st==='redo'?'redo':'')+'" data-p="'+i+'">'
      +'<span class="num">'+(st==='ok'?'✓':st==='redo'?'!':(i+1))+'</span>'
      +'<span class="ttl"><strong>'+p.t+'</strong><br><span style="color:var(--muted);font-size:13.5px">'+p.src+' · '+p.fmt+'</span></span>'
      +'<span class="mm">'+p.mins+' min</span></button>';
  });
  const card=document.createElement('div');
  card.innerHTML='<div class="card"><div class="qmeta"><span>'+c.name+' · Exam problems</span><span class="fmt">'+tot+' min total</span></div>'
    +'<p style="color:var(--muted);margin:0 0 16px">Straight from the course practice sheets, with the official solutions. Work each one on paper, then reveal.</p>'
    +'<div class="plist">'+list+'</div>'
    +'<div class="note"><b>How to use these.</b> Do not read the solution first. Write your own answer, then open it and compare line by line — the marks come from the working, not the final number.</div></div>';
  stage.innerHTML=''; stage.appendChild(card);
  stage.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ pi=+b.getAttribute('data-p'); go(); });
}

/* ---------- ONE PROBLEM ---------- */
function renderProblem(){
  const c=CHAPTERS[ci], p=c.problems[pi];
  const card=document.createElement('div'); card.className='card lesson';
  card.innerHTML='<div class="qmeta"><span class="psrc">'+p.src+'</span><span class="fmt">'+p.fmt+'</span><span>'+p.mins+' min</span></div>'
    +'<h2>Problem '+(pi+1)+' — '+p.t+'</h2><div class="qbody">'+p.q+'</div>';

  const wrap=document.createElement('div');
  const btn=document.createElement('button'); btn.className='btn'; btn.style.marginTop='18px'; btn.textContent='Show the solution';
  const sol=document.createElement('div'); sol.className='sol'; sol.hidden=true;
  sol.innerHTML='<h4>Official solution</h4>'+p.sol;
  btn.onclick=()=>{ sol.hidden=false; btn.hidden=true; marks.hidden=false; };
  wrap.append(btn,sol);

  const marks=document.createElement('div'); marks.className='selfmark'; marks.hidden=mark[ci][pi]===null;
  const lab=document.createElement('span'); lab.className='lab'; lab.textContent='How did you do?';
  const ok=document.createElement('button'); ok.className='mk good'; ok.textContent='Got it';
  const no=document.createElement('button'); no.className='mk bad'; no.textContent='Review again';
  const sync=()=>{ ok.setAttribute('aria-pressed', mark[ci][pi]==='ok'); no.setAttribute('aria-pressed', mark[ci][pi]==='redo'); };
  ok.onclick=()=>{ mark[ci][pi]='ok'; sync(); meter(); drawChips(); save(); };
  no.onclick=()=>{ mark[ci][pi]='redo'; sync(); meter(); drawChips(); save(); };
  sync(); marks.append(lab,ok,no);
  wrap.appendChild(marks);
  if(mark[ci][pi]!==null){ sol.hidden=false; btn.hidden=true; }
  card.appendChild(wrap);

  const nav=document.createElement('div'); nav.className='nav';
  const left=document.createElement('div'); left.style.display='flex'; left.style.gap='8px'; left.style.flexWrap='wrap';
  const back=document.createElement('button'); back.className='btn ghost'; back.textContent='← All problems';
  back.onclick=()=>{ pi=-1; go(); }; left.appendChild(back);
  const right=document.createElement('div'); right.style.display='flex'; right.style.gap='8px'; right.style.flexWrap='wrap';
  if(pi<c.problems.length-1){
    const n=document.createElement('button'); n.className='btn'; n.textContent='Problem '+(pi+2)+' →';
    n.onclick=()=>{ pi++; go(); }; right.appendChild(n);
  } else if(ci<CHAPTERS.length-1){
    const n=document.createElement('button'); n.className='btn'; n.textContent='Start '+CHAPTERS[ci+1].name+' →';
    n.onclick=()=>{ ci++; ui=0; pi=-1; mode='learn'; go(); }; right.appendChild(n);
  } else {
    const n=document.createElement('button'); n.className='btn'; n.textContent='Back to plan';
    n.onclick=()=>{ mode='home'; go(); }; right.appendChild(n);
  }
  nav.append(left,right); card.appendChild(nav);
  stage.innerHTML=''; stage.appendChild(card);
}

/* ==================== WIDGET: DATAPATH ==================== */
const DP_BASE_C=['c-pcmux','c-pc','c-im','c-add4','c-ctrl','c-regs'];
const DP_BASE_W=['w-add4-pcmux','w-pcmux-pc','w-pc-im','w-pc-add4','w-im-bus','w-bus-ctrl','w-bus-regs'];
const DP = {
 R:{label:'add x1, x2, x3', c:['c-alusrc','c-alu','c-aluctl','c-m2r'],
    w:['w-bus-aluctl','w-regs-alu1','w-regs-alu2','w-alusrc-alu','w-alu-m2r','w-m2r-regs'],
    s:{ALUSrc:0,MemtoReg:0,RegWrite:1,MemRead:0,MemWrite:0,Branch:0,ALUOp:'10',PCSrc:0},
    m:'R-TYPE  add x1, x2, x3\n1. Fetch, and PC+4 is selected (PCSrc = 0).\n2. rs1 and rs2 are read from the register file.\n3. ALUSrc = 0, so the ALU’s second input is Read data 2.\n4. ALU control (ALUOp = 10 + funct bits) picks the operation.\n5. MemtoReg = 0, so the ALU result travels back to Write data.\n6. RegWrite = 1 commits it into rd.\nData memory and the whole branch path are unused.'},
 LD:{label:'ld x1, 8(x2)', c:['c-imm','c-alusrc','c-alu','c-aluctl','c-dm','c-m2r'],
    w:['w-bus-imm','w-bus-aluctl','w-imm-alusrc','w-regs-alu1','w-alusrc-alu','w-alu-dm','w-dm-m2r','w-m2r-regs'],
    s:{ALUSrc:1,MemtoReg:1,RegWrite:1,MemRead:1,MemWrite:0,Branch:0,ALUOp:'00',PCSrc:0},
    m:'LOAD  ld x1, 8(x2)\n1. Fetch, PC+4 as usual.\n2. rs1 (the base register) is read → ALU input A.\n3. Imm Gen sign-extends the offset; ALUSrc = 1 sends it to ALU input B.\n4. ALUOp = 00 forces ADD → the effective address.\n5. MemRead = 1, so Data memory produces Read data.\n6. MemtoReg = 1 routes memory data to Write data; RegWrite = 1 commits.\nRead data 2 is unused.'},
 SD:{label:'sd x1, 8(x2)', c:['c-imm','c-alusrc','c-alu','c-aluctl','c-dm'],
    w:['w-bus-imm','w-bus-aluctl','w-imm-alusrc','w-regs-alu1','w-regs-alu2','w-regs-dm','w-alusrc-alu','w-alu-dm'],
    s:{ALUSrc:1,MemtoReg:'X',RegWrite:0,MemRead:0,MemWrite:1,Branch:0,ALUOp:'00',PCSrc:0},
    m:'STORE  sd x1, 8(x2)\n1. Fetch, PC+4 as usual.\n2. Address is built exactly like a load: rs1 + sign-extended immediate (ALUSrc = 1, ALU adds).\n3. Read data 2 — the value being stored — goes to Data memory Write data.\n4. MemWrite = 1 writes it.\n5. RegWrite = 0: nothing returns to the register file, so MemtoReg is a don’t-care.'},
 BEQ:{label:'beq x1, x2, L', c:['c-imm','c-sl1','c-addbr','c-and','c-alusrc','c-alu','c-aluctl'],
    w:['w-bus-imm','w-bus-aluctl','w-imm-sl1','w-sl1-addbr','w-pc-addbr','w-addbr-pcmux','w-regs-alu1','w-regs-alu2','w-alusrc-alu','w-alu-zero','w-ctrl-and','w-and-pcmux'],
    s:{ALUSrc:0,MemtoReg:'X',RegWrite:0,MemRead:0,MemWrite:0,Branch:1,ALUOp:'01',PCSrc:'B&Z'},
    m:'BRANCH  beq x1, x2, L\n1. Fetch. PC+4 goes to PCSrc mux input 0.\n2. PC also feeds the branch adder.\n3. Imm Gen → Shift left 1 → the adder’s other input → Sum = branch target → mux input 1.\n4. Both registers read; ALUSrc = 0; ALUOp = 01 → ALU control 0110 → SUBTRACT.\n5. PCSrc = Branch AND Zero. Equal → take the branch. Not equal → PC+4.\nNo register write, no memory access.'}
};
let dpCur='R';
function dpInit(){
  const bt=document.getElementById('dpbtns'); if(!bt) return;
  bt.innerHTML=Object.keys(DP).map(k=>'<button class="btn sm '+(k===dpCur?'':'ghost')+'" data-dp="'+k+'">'+DP[k].label+'</button>').join('');
  bt.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{ dpCur=b.getAttribute('data-dp'); dpInit(); });
  dpSet(dpCur);
}
function dpSet(k){
  const d=DP[k], svg=document.getElementById('dpsvg'); if(!svg) return;
  const onC=new Set(DP_BASE_C.concat(d.c)), onW=new Set(DP_BASE_W.concat(d.w));
  svg.querySelectorAll('.cmp').forEach(g=>{ g.classList.toggle('act',onC.has(g.id)); g.classList.toggle('dim',!onC.has(g.id)); });
  svg.querySelectorAll('.wire').forEach(p=>{ p.classList.toggle('actw',onW.has(p.id)); p.classList.toggle('dim',!onW.has(p.id)); });
  document.getElementById('dpsig').innerHTML=Object.keys(d.s).map(n=>{
    const v=d.s[n], cls = v==='X' ? 'x' : (v===1||v==='10'||v==='01'||v==='B&Z') ? 'one' : 'zero';
    return '<div class="csig '+cls+'"><span class="n">'+n+'</span><span class="v">'+v+'</span></div>';
  }).join('');
  document.getElementById('dpmsg').textContent=d.m;
}

/* ==================== WIDGET: PIPELINE ==================== */
function pipeRow(who, offset, stages, extra){
  let cells='<span class="who">'+who+'</span>';
  for(let i=0;i<offset;i++) cells+='<span class="st gap"></span>';
  stages.forEach(s=>{ cells+='<span class="st '+(s==='··'?'bub':s)+'">'+s+'</span>'; });
  return '<div class="piperow">'+cells+'</div>'+(extra?'<div class="hint" style="margin:2px 0 8px 96px">'+extra+'</div>':'');
}
const P5=['IF','ID','EX','MEM','WB'];
function pipeDraw(){
  const a=document.getElementById('pipedemo');
  if(a) a.innerHTML='<div class="simhead">Pipelined — three loads, 200 ps per stage</div>'
    + pipeRow('ld x1,100(x4)',0,P5) + pipeRow('ld x2,200(x4)',1,P5)
    + pipeRow('ld x3,400(x4)',2,P5,'last one finishes at 1400 ps; single-cycle would need 3 × 800 = 2400 ps');
  const b=document.getElementById('fwdemo');
  if(b) b.innerHTML='<div class="simhead">Forwarding — EX output feeds straight into the next EX</div>'
    + pipeRow('add x1,x2,x3',0,P5)
    + pipeRow('sub x4,x1,x5',1,P5,'x1 is ready at the end of add’s EX, and sub needs it at the start of its EX → 0 stalls');
  const c=document.getElementById('ludemo');
  if(c) c.innerHTML='<div class="simhead">Load-use — one bubble is unavoidable</div>'
    + pipeRow('ld x1,0(x2)',0,P5)
    + pipeRow('sub x4,x1,x5',1,['IF','··','ID','EX','MEM','WB'],'x1 only exists after ld’s MEM, so sub waits one cycle, then forwards MEM → EX');
}

/* ==================== WIDGET: CACHE SIM ==================== */
const SIM_START=[{v:1,tag:"100"},{v:0,tag:""},{v:1,tag:"011"},{v:1,tag:"001"},
                 {v:0,tag:""},{v:1,tag:"000"},{v:1,tag:"010"},{v:0,tag:""}];
const SIM_ACCESS=["100100","111010","010110","100100","111110"];
let simRows,simStep,simLog;
function simReset(){ simRows=SIM_START.map(r=>({...r})); simStep=0; simLog=[]; }
function simDraw(){
  const el=document.getElementById('sim'); if(!el) return;
  const cur=simStep>0?SIM_ACCESS[simStep-1]:null, curIdx=cur?parseInt(cur.slice(3),2):-1;
  let rows='';
  simRows.forEach((r,i)=>{ rows+='<tr class="'+(i===curIdx?'on':'')+'"><td class="m">'+i.toString(2).padStart(3,'0')
    +'</td><td class="m">'+r.v+'</td><td class="m">'+(r.tag||'—')+'</td></tr>'; });
  const done=simStep>=SIM_ACCESS.length;
  el.innerHTML='<div class="simhead">8 blocks · tag 3 bits, index 3 bits, offset 0 bits</div>'
    +'<div class="simgrid">'
      +'<div class="tblwrap" style="margin:0"><table class="tbl"><tr><th>Index</th><th>V</th><th>Tag</th></tr>'+rows+'</table></div>'
      +'<div><div class="simmsg">'+(simLog.length?simLog.join('\n'):'Press Step to run access 1.')+'</div>'
      +'<div class="simbtns"><button class="btn sm" id="simStep"'+(done?' disabled':'')+'>'
      +(done?'All 5 done':'Step ('+(simStep+1)+' of 5)')+'</button>'
      +'<button class="btn sm ghost" id="simReset">Reset</button></div></div></div>';
  const b=document.getElementById('simStep'); if(b) b.onclick=simNext;
  const r=document.getElementById('simReset'); if(r) r.onclick=()=>{ simReset(); simDraw(); };
}
function simNext(){
  if(simStep>=SIM_ACCESS.length) return;
  const addr=SIM_ACCESS[simStep], tag=addr.slice(0,3), idx=addr.slice(3);
  const i=parseInt(idx,2), row=simRows[i];
  let line='Access '+(simStep+1)+': '+addr+'  → tag '+tag+', index '+idx+'\n';
  if(row.v===0){ line+='  V = 0 → MISS. Load block, V = 1, tag = '+tag; row.v=1; row.tag=tag; }
  else if(row.tag!==tag){ line+='  V = 1 but tag '+row.tag+' ≠ '+tag+' → MISS. Replace with tag '+tag; row.tag=tag; }
  else { line+='  V = 1 and tag matches → HIT. Table unchanged'; }
  simLog.push(line); simStep++;
  if(simStep===SIM_ACCESS.length) simLog.push('\n2 hits, 3 misses → hit ratio 2/5, miss ratio 3/5');
  simDraw();
}
